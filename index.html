 if(show('limited')){h+=`<div class="sec">Limited use</div>`+(D.res.length?D.res.map(resRow).join(''):`<div class="empty">No limited-use abilities.</div>`)}
 return h}
function short(t){t=String(t||'').split(/[.(]/)[0].trim();return t.length>48?t.slice(0,46)+'...':t}
function featRow(f){const i=D.cls.f.indexOf(f);return`<div class="feat" ${on('openPanel','feature',i)}><div class="fn">${esc(f[1])}</div><div class="fs">${D.cls.n} ${f[0]} • ${{action:'Action',bonus:'Bonus action',reaction:'Reaction',other:'Feature'}[f[2]]}</div><div class="fd">${esc(f[3])}</div></div>`}
function traitRow(n){const i=D.race.tr.findIndex(t=>t[0]===n);if(i<0)return'';return`<div class="feat" ${on('openPanel','trait',i)}><div class="fn">${esc(n)}</div><div class="fs">${esc(D.race.n)} trait</div><div class="fd">${esc(D.race.tr[i][1])}</div></div>`}
const RESET_L={short:'Short rest',long:'Long rest',mission:'Per mission',none:'Manual'};
function resRow(r){return`<div class="res"><div class="rn" ${on('openPanel','res',r.key)}><b>${esc(r.name)}</b><small>${r.src} • ${RESET_L[r.reset]} • ${r.max-r.used} of ${r.max} left</small></div>
 <div class="boxes">${[...Array(r.max)].map((_,i)=>`<button class="ubox ${i<r.used?'used':''}" ${on('toggleUse',r.key,i)} aria-label="Use ${esc(r.name)}"></button>`).join('')}</div></div>`}

function tabAbilities(){let h='';
 if(C.cls==='scientist')h+=`<div class="sec">Eureka points</div><div class="res"><div class="rn" ${on('openPanel','feature',0)}><b>Eureka</b><small>Gain one when you fail an INT or WIS check. Spend for advantage. Max ${D.eurekaMax}.</small></div>
  <div class="ctr"><button ${on('adjEureka',-1)}>−</button><span class="mono" style="font-size:20px;min-width:52px;text-align:center">${Math.min(C.eureka,D.eurekaMax)}/${D.eurekaMax}</span><button ${on('adjEureka',1)}>+</button></div></div>`;
 if(C.cls==='diplomat')h+=`<div class="sec">Inspire die</div><div class="res"><div class="rn"><b>Inspire die: ${D.inspDie}</b><small>Temporary HP granted by Inspire and Word In An Ear</small></div><button class="rbtn" ${on('rollPlain','Inspire die',D.inspDie)}>Roll ${D.inspDie}</button></div>`;
 h+=`<div class="sec"><span>Limited-use abilities</span><span style="display:flex;gap:6px"><button class="btn sm" ${on('openPanel','addres')}>Add tracker</button><button class="btn sm" ${on('openPanel','newmission')}>New mission</button></span></div>`;
 h+=D.res.length?D.res.map(resRow).join(''):`<div class="empty">No limited-use abilities yet. Choose a class and race in Manage, or add your own tracker.</div>`;
 if(D.cls){const sf=C.feats.filter(f=>f.cat===D.cls.feat);h+=`<div class="sec"><span>${D.cls.feat} feats</span><button class="btn sm" ${on('openPanel','addfeat',D.cls.feat)}>Add ${D.cls.feat}</button></div>`;
  h+=sf.length?sf.map(featItem).join(''):`<div class="empty">Your class chooses ${D.cls.feat} feats as it levels. Add the ones you've picked here.</div>`}
 return h}
function featItem(f){return`<div class="feat" ${on('openPanel','feat',f.id)}><div class="fn">${esc(f.name)}</div><div class="fs">${esc(f.cat)}${+f.mp?' • '+f.mp+' MP':''}</div><div class="fd">${esc(f.desc||'')}</div></div>`}

function tabInventory(){const cap=D.loadCap,b=D.bulk,pct=cap?Math.min(100,b/cap*100):b?100:0;
 let h=`<div class="sec"><span>Loadout</span><button class="btn sm pri" ${on('openPanel','additem')}>Add items</button></div>
 <div class="kv" style="border:none"><span>Bulk carried (outside base kit)</span><b>${b} / ${cap}</b></div><div class="bar ${b>cap?'over':''}"><i style="width:${pct}%"></i></div>
 <div class="muted" style="font-size:12px;margin:5px 0 4px">${b>cap?'<span style="color:var(--red2)">Over your loadout. Drop something or check with your GM.</span>':'Capacity = equipped armour loadout + STR modifier. Base kit items don\'t count.'}</div>`;
 const row=it=>`<tr class="clkrow" ${on('openPanel','item',it.id)}><td style="width:34px">${(it.w||it.a)?`<input type="checkbox" ${it.eq?'checked':''} ${onS('toggleEquip',it.id)} aria-label="Equip">`:''}</td>
  <td><b>${esc(it.n)}</b><div class="sub2">${esc(it.t==='weapon'?'Weapon':it.t==='armor'?(it.a.kind==='addon'?'Armour add-on':it.a.kind==='heavy'?'Heavy armour':'Light armour'):'Gear')} • TL ${it.tl??'-'}</div></td>
  <td class="mono">${it.kit?'<span class="muted">kit</span>':(+it.b||0)*(+it.qty||1)}</td><td class="mono">${it.qty||1}</td><td style="font-size:12px;color:var(--text2)">${esc(it.notes||(it.d||'').slice(0,70))}</td></tr>`;
 const carried=C.inv.filter(i=>!i.kit),kit=C.inv.filter(i=>i.kit);
 const tbl=list=>`<div class="tblwrap"><table class="tbl"><thead><tr><th>Equip</th><th>Name</th><th>Bulk</th><th>Qty</th><th>Notes</th></tr></thead><tbody>${list.map(row).join('')}</tbody></table></div>`;
 h+=`<div class="sec">Loadout items</div>`+(carried.length?tbl(carried):`<div class="empty">Nothing extra carried yet. Use Add items for gear you requisition, find or steal.</div>`);
 h+=`<div class="sec">Base kit (issued, no bulk)</div>`+(kit.length?tbl(kit):'');
 const extra=[...BASE_KIT];if(D.cls)extra.push(D.cls.kit+' (class)');if(C.race==='human_tollan')extra.push('Phase Device (Tollan)');
 h+=`<div class="kitl" style="margin-top:8px">${extra.map(k=>`<label><input type="checkbox" ${C.kit[k]!==false?'checked':''} ${on('toggleKit',k)}> ${esc(k)}</label>`).join('')}</div>`;
 return h}

function tabFeatures(){const F=UI.filter;let h=filters([['all','All'],['class','Class'],['race','Race'],['origins','Origins'],['feats','Feats']],F,'setFilter');const show=k=>F==='all'||F===k;
 if(show('class')){h+=`<div class="sec">${D.cls?D.cls.n+' features':'Class features'}</div>`;h+=D.cls?D.cls.f.map((f,i)=>`<div class="feat" ${on('openPanel','feature',i)} style="${f[0]>D.lvl?'opacity:.45':''}"><div class="fn">${esc(f[1])}</div><div class="fs">Level ${f[0]}${f[0]>D.lvl?' • not yet':''}</div><div class="fd">${esc(f[3])}</div></div>`).join(''):`<div class="empty">Choose a class in Manage.</div>`}
 if(show('race')){h+=`<div class="sec">${D.race?esc(D.race.n)+' traits':'Racial traits'}</div>`;h+=D.race?`<div class="kv"><span>Hit point bonus</span><b>+${D.race.hp}</b></div><div class="kv"><span>Ability score increase</span><b>${esc(D.race.asi)}</b></div><div class="kv"><span>Proficiencies</span><b>${esc(D.race.prof)}</b></div>`+D.race.tr.map((t,i)=>`<div class="feat" ${on('openPanel','trait',i)}><div class="fn">${esc(t[0])}</div><div class="fd">${esc(t[1])}</div></div>`).join(''):`<div class="empty">Choose a race in Manage.</div>`}
 if(show('origins')){h+=`<div class="sec"><span>Origins</span><button class="btn sm" ${on('openPanel','manage')}>Change</button></div>`;h+=D.origins.length?D.origins.map(o=>`<div class="feat" ${on('openPanel','origin',o.n)}><div class="fn">${esc(o.n)}: ${esc(o.ab)}</div><div class="fs">${o.c} origin • ${esc(o.a)}</div><div class="fd">${esc(o.t)}</div></div>`).join(''):`<div class="empty">Choose two origins from different categories (Biome, Background, Racial) in Manage.</div>`}
 if(show('feats')){h+=`<div class="sec"><span>Feats</span><button class="btn sm" ${on('openPanel','addfeat','General')}>Add feat</button></div>`;h+=C.feats.length?C.feats.map(featItem).join(''):`<div class="empty">No feats recorded yet.</div>`}
 return h}

function ta(path,label,ph,rows=5){const v=path.split('.').reduce((o,k)=>o?.[k],C)||'';return`<div class="sec">${label}</div><textarea rows="${rows}" placeholder="${esc(ph)}" oninput="setField('${path}',this.value)">${esc(v)}</textarea>`}
function tabBackground(){return ta('bg.traits','Personality traits','How do they act? What do people notice first?',3)+ta('bg.ideals','Ideals','What do they believe in?',2)+ta('bg.bonds','Bonds','Who or what do they care about?',2)+ta('bg.flaws','Flaws','Weaknesses, vices, blind spots.',2)+ta('bg.appearance','Appearance','Physical description and distinguishing features.',3)+ta('bg.allies','Allies & organisations','Contacts, factions, standing.',3)+ta('bg.story','Backstory','Where did they come from? Why the Phoenix Site?',6)}
function tabNotes(){return ta('notes.session','Session notes','Discoveries, open questions, gate addresses, names to remember.',10)+ta('notes.general','Other notes','Anything else.',6)}

function tabExtras(){const E=+C.mp.earned||0;const fac=C.facility;
 let h=`<div class="sec">Mission points</div><div class="fgrid"><div><div class="lbl">MP earned (total)</div><input type="number" min="0" value="${E}" onchange="setNum('mp.earned',this.value)"></div>
  <div><div class="lbl">MP spent on feats</div><input disabled value="${D.featMP}"></div></div>
  <div class="kv"><span>${E<20?'Levels 1 to 5: every 5 MP earned is a level':'Specialist: every 10 MP spent on feats is a level'}</span><b>Level ${D.mpLevel}</b></div>
  ${E>=20?`<div class="kv"><span>MP available to spend</span><b>${D.mpAvail}</b></div>`:''}
  ${E>0&&D.mpLevel!==D.lvl?`<div class="panel-actions"><button class="btn" ${on('setLevel',D.mpLevel)}>Set level to ${D.mpLevel}</button></div>`:''}`;
 h+=`<div class="sec">Downtime facility (this mission)</div><div class="fgrid"><div><div class="lbl">Facility</div><select onchange="setVal('facility.name',this.value)"><option value="">None</option>${Object.keys(FACILITIES).map(k=>`<option ${fac.name===k?'selected':''}>${k}</option>`).join('')}</select></div>
  <div><div class="lbl">Facility bonus (1 to 5)</div><input type="number" min="1" max="5" value="${fac.rating||1}" onchange="setNum('facility.rating',this.value)"></div></div>
  ${fac.name?`<p class="muted" style="font-size:13px;margin-bottom:6px">${esc(FACILITIES[fac.name])}</p>`:''}
  <input placeholder="Note (e.g. chosen skill, honing plan)" value="${esc(fac.note||'')}" oninput="setField('facility.note',this.value)">
  <div class="panel-actions"><button class="btn" ${on('openPanel','newmission')}>Start new mission</button></div>`;
 h+=`<div class="sec">Theme</div><select onchange="setTheme(this.value)">${Object.keys(THEMES).map(k=>`<option value="${k}" ${C.theme===k?'selected':''}>${k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).replace('Sgc','SGC').replace('Goauld',"Goa'uld").replace('Tokra',"Tok'ra").replace('Kethalis',"Keth'alis")}</option>`).join('')}</select>`;
 h+=`<div class="sec">Backup</div><div class="panel-actions" style="margin-top:0"><button class="btn" onclick="exportData()">Download backup (.json)</button><button class="btn" onclick="$('impF').click()">Restore from backup</button><input type="file" id="impF" accept=".json" class="hidden" onchange="importData(event)"></div>`;
 return h}
// ============================================================
// SIDE PANEL
// ============================================================
function isWide(){return window.innerWidth>=1280}
function openPanel(k,a){UI.panel={k,a};UI.open=true;applySide();renderSide();if(!isWide()||!UI.pinned)$('side-body').scrollTop=0}
function closeSide(){UI.open=false;applySide()}
function togglePin(){UI.pinned=!UI.pinned;try{localStorage.setItem('sgc-pinned',UI.pinned?'1':'0')}catch(e){}applySide()}
function applySide(){const s=$('side'),over=!isWide()||!UI.pinned;
 s.classList.toggle('overlay',over);s.classList.toggle('open',over&&UI.open);s.classList.toggle('hidden',!over&&!UI.open);
 $('scrim').classList.toggle('hidden',!(over&&UI.open));$('fab').classList.toggle('hidden',UI.open);
 const pb=$('pinbtn');pb.classList.toggle('hidden',!isWide());pb.textContent=UI.pinned?'Unpin':'Pin';pb.title=UI.pinned?'Let the panel slide over the sheet':'Keep the panel fixed beside the sheet'}
window.addEventListener('resize',()=>{clearTimeout(window._rs);window._rs=setTimeout(applySide,120)});

const PANEL_T={log:'Game log',ability:'Ability',save:'Saving throw',saveinfo:'Saving throws',skill:'Skill',skillinfo:'Skills',hp:'HP management',tension:'Tension die',dp:'Determination',prof:'Proficiency bonus',speed:'Speed',ac:'Armour class',init:'Initiative',moxie:'Moxie',senses:'Senses',defenses:'Defences',conditions:'Conditions',shortrest:'Short rest',longrest:'Long rest',manage:'Manage character',item:'Item',additem:'Add items',action:'Action',feature:'Class feature',trait:'Racial trait',origin:'Origin',feat:'Feat',addfeat:'Add feat',res:'Limited use',addres:'Add tracker',profs:'Proficiencies',newmission:'New mission',settings:'Settings',appearance:'Appearance'};
function renderSide(){const {k,a}=UI.panel;$('side-t').textContent=PANEL_T[k]||'';const f=PANELS[k]||PANELS.log;$('side-body').innerHTML=f(a)}
const btn=(label,fn,args=[],cls='btn')=>`<button class="${cls}" ${on(fn,...args)}>${label}</button>`;
const rollBtn=(label,fn,...args)=>`<button class="btn pri" ${on(fn,...args)}>${label}</button>`;
function custBlock(key,inner){const open=!!(UI.custOpen&&UI.custOpen[key]);
 return`<div class="custwrap"><button class="custtoggle" ${on('toggleCustom',key)}>${open?'︿':'⌄'} Customize</button>${open?`<div class="custbody">${inner}</div>`:''}</div>`}
function ago(t){const s=Math.round((Date.now()-t)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'}

const PANELS={
settings(){return`<h2>Settings</h2>
 ${isGM?`<div class="res"><div class="rn" ${on('showPicker')}><b>Characters</b><small>See or switch to any player's sheet</small></div></div>`:''}
 <div class="res"><div class="rn" ${on('openPanel','appearance')}><b>Change sheet appearance</b><small>Colour theme, border style, background, night mode</small></div></div>
 <div class="res"><div class="rn" ${on('openPanel','profs')}><b>Proficiencies &amp; training</b><small>Armour, weapons, tools, languages</small></div></div>
 <div class="res"><div class="rn" ${on('setTab','extras')}><b>Backup &amp; mission points</b><small>Download/restore a backup, downtime facility</small></div></div>`},

appearance(){const bs=C.borderStyle||'hud';const bg=C.bgImage;
 return`<h2>Appearance</h2>
 <h3>Colour theme</h3><div class="swrow">${Object.keys(THEMES).map(k=>`<button class="sw ${C.theme===k?'on':''}" style="background:${THEMES[k].acc||THEMES[k].acc2}" title="${themeLabel(k)}" ${on('setTheme',k)}></button>`).join('')}</div>
 <div class="muted" style="font-size:12px;margin-top:2px">${themeLabel(C.theme)}</div>
 <h3>Border style</h3><div class="bsrow">${[['hud','HUD Corners'],['round','Rounded'],['cut','Angular Cut'],['hairline','Hairline']].map(([k,l])=>`<button class="bsopt bs-${k} ${bs===k?'on':''}" ${on('setBorderStyle',k)}><span class="bssample"></span>${l}</button>`).join('')}</div>
 <h3>Background</h3>
 <div class="frow"><button class="btn sm ${!bg?'on':''}" ${on('clearBg')}>Solid colour</button><button class="btn sm" onclick="$('bgUp').click()">Upload image</button><input type="file" id="bgUp" class="hidden" accept="image/*" onchange="loadBgImage(event)"></div>
 ${bg?`<div class="kv"><span>Custom background set</span><button class="btn sm" ${on('clearBg')}>Remove</button></div>`:'<p class="rule">An image is dimmed automatically so text stays readable.</p>'}
 <h3>Night mode</h3><label class="frow"><input type="checkbox" ${C.nightMode?'checked':''} ${on('toggleNight')}> Dim the whole sheet slightly, easier on the eyes for late sessions</label>`},

log(){if(!UI.log.length)return`<h2>Game log</h2><p class="rule">Click any modifier, save, skill, attack or damage value on the sheet to roll it. Results appear here. Use the Adv / Dis buttons at the top to roll your next d20 with advantage or disadvantage.</p><p class="rule">The log is kept on this device for this session.</p>`;
 return`<div class="panel-actions" style="margin-top:0">${btn('Clear log','clearLog',[],'btn sm')}</div>`+UI.log.map(e=>`<div class="logentry"><div class="who">${esc(C.name||'You')} • ${ago(e.time)}</div>
  <div class="logcard ${e.cls}"><div class="lt">${esc(e.title)}${e.kind?`: <em>${esc(e.kind)}</em>`:''}<span class="brk">${esc(e.brk)}</span></div>${e.total!==''?`<div class="tot">${e.total}</div>`:''}</div></div>`).join('')},

ability(k){const a=ABILS.find(x=>x.k===k);return`<h2>${a.n}</h2>
 <div class="kv"><span>Score</span><b>${C.scores[k]}</b></div>
 <div class="kv"><span>Modifier</span><b>${sgn(D.m[k])}</b></div>
 <div class="kv"><span>${a.n} save</span><b>${sgn(D.saves[k])}${C.saveProf[k]?' • proficient':''}</b></div>
 <p style="margin-top:12px">${esc(a.d)}</p>
 ${custBlock('ability-'+k,`<div class="ctr" style="margin-bottom:8px"><button ${on('adjScore',k,-1)}>−</button><input type="number" style="width:80px;text-align:center" value="${C.scores[k]}" onchange="setScore('${k}',this.value)"><button ${on('adjScore',k,1)}>+</button></div>
 <p class="rule">Enter your final score, including racial and origin bonuses. Modifier = (score − 10) ÷ 2, rounded down. Player characters can't exceed 20.</p>
 <label class="frow"><input type="checkbox" ${C.saveProf[k]?'checked':''} ${on('toggleSaveProf',k)}> Proficient in ${a.n} saves</label>`)}`},

saveinfo(){return`<h2>Saving throws</h2><p>A save resists harm such as a blast, poison or Goa'uld mind control. Roll d20 + the ability modifier, plus your proficiency bonus if proficient.</p>
 ${ABILS.map(a=>`<div class="kv"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${C.saveProf[a.k]?'checked':''} ${on('toggleSaveProf',a.k)}> ${a.n}</label><b class="clk" ${on('rollSave',a.k)}>${sgn(D.saves[a.k])}</b></div>`).join('')}
 <p class="rule" style="margin-top:10px">Class saves: Diplomat WIS/CHA, Engineer DEX/INT, Medic DEX/WIS, Scientist INT/WIS, Scout CON/DEX, Soldier STR/CON.${C.facility.name==='Mess Hall'?' Mess Hall bonus included in CON and WIS.':''}</p>`},

skill(n){const s=SKILLS.find(x=>x.n===n),k=D.skills[n];return`<h2>${n}</h2><p class="rule">${ABN(k.ab)}</p><p>${esc(s.d)}</p>
 ${custBlock('skill-'+n,`<div class="kv"><span>${ABN(k.ab)} modifier</span><b>${sgn(D.m[k.ab])}</b></div>
 <div class="kv"><span>${k.pl===2?'Expertise (double proficiency)':k.pl?'Proficiency':k.half?'Cross-Discipline Studies (half)':'Not proficient'}</span><b>${sgn(k.pl?D.prof*k.pl:k.half)}</b></div><div class="kv"><span>Total</span><b>${sgn(k.v)}</b></div>
 <h3>Proficiency</h3><div class="seg">${[[0,'None'],[1,'Proficient'],[2,'Expertise']].map(([v,l])=>`<button class="${k.pl===v?'on':''}" ${on('setSkillProf',n,v)}>${l}</button>`).join('')}</div>
 <h3>Ability used</h3><select onchange="setSkillAbil('${n}',this.value)"><option value="">Automatic (${AB(k.ab)})</option>${ABILS.map(a=>`<option value="${a.k}" ${C.skillAbil[n]===a.k?'selected':''}>${a.n}</option>`).join('')}</select>
 <p class="rule" style="margin-top:6px">Some origins and abilities let you use a different ability for this skill. Automatic picks the best one you're allowed.</p>`)}`},
skillinfo(){return`<h2>Skills</h2><p>Click a skill's bonus to roll it, or its name for details. Click the dot to cycle between not proficient, proficient (adds ${sgn(D.prof)}) and expertise (adds ${sgn(D.prof*2)}).</p><p class="rule">A dashed dot means Cross-Discipline Studies is adding half your proficiency bonus.</p>`},

prof(){return`<h2>Proficiency bonus: ${sgn(D.prof)}</h2><p>Added to any d20 roll using a skill, save, tool or weapon you're proficient with. It never applies more than once to the same roll.</p><h3>By level</h3>${[[1,4,2],[5,8,3],[9,12,4],[13,16,5],[17,20,6]].map(([a,b,p])=>`<div class="kv"><span>Levels ${a} to ${b}</span><b>+${p}</b></div>`).join('')}`},

speed(){return`<h2>Speed: ${D.speed}m</h2><p>How far you can move in one combat round. Everyone starts at 6m.</p>
 <h3>Breakdown</h3><div class="kv"><span>Base</span><b>6m</b></div>${D.origins.filter(o=>o.spd).map(o=>`<div class="kv"><span>${o.n}</span><b>+${o.spd}m</b></div>`).join('')}
 ${D.body&&D.body.a.kind==='heavy'?'<div class="kv"><span>Heavy armour</span><b>−2m</b></div>':''}${D.strShort?'<div class="kv"><span>Armour Strength requirement not met</span><b>1m</b></div>':''}
 ${C.exh>=2?`<div class="kv"><span>Exhaustion ${C.exh}</span><b>${C.exh>=5?'0m':'halved'}</b></div>`:''}
 <h3>Other modifier</h3><input type="number" value="${+C.speedMod||0}" onchange="setNum('speedMod',this.value)">
 <p class="rule" style="margin-top:8px">Low gravity adds 2m. Climbing, crawling or swimming costs double unless you have that speed. Difficult terrain costs double.</p>`},

tension(){return`<h2>Tension die</h2><p>Set by the GM for each episode or scene, using the dropdown at the top of the sheet. Anything marked +TD rolls this die automatically as part of that roll, so you shouldn't need to roll it alone.</p>
 ${Object.entries(TENSION).map(([k,t])=>`<div class="kv" style="align-items:flex-start;${C.tension===k?'':'opacity:.55'}"><span><b style="font-family:var(--mono)">${k}</b> ${t.n}<br><span class="muted" style="font-size:12.5px">${t.t}</span></span><b>DC ${t.dc}</b></div>`).join('')}
 <div class="panel-actions">${btn('Roll '+C.tension+' on its own','rollTD',[],'btn sm')}</div>`},

dp(){return`<h2>Determination: ${D.dp} / ${D.dpBase}</h2><p>Grit and force of will, wagered or spent in Plot encounters (convince, diplomatic function, infiltration and so on). Some feats spend DP in other ways.</p>
 <div class="ctr" style="margin:8px 0 12px"><button ${on('adjDP',-1)}>−</button><span class="mono" style="font-size:22px;min-width:40px;text-align:center">${D.dp}</span><button ${on('adjDP',1)}>+</button>${btn('Reset to base','setDP',[null],'btn sm')}</div>
 <h3>Rules</h3><ul class="rule"><li>Base DP = proficiency bonus (${sgn(D.prof)}) + class bonus (${D.cls?'+'+D.cls.det:'+0'}).</li><li>You can earn DP above your base. You can't go below 0.</li><li>At 0 DP you can't choose to wager, but if forced you wager the minimum.</li><li>DP resets to base at the end of every long rest.</li></ul>`},

init(){return`<h2>Initiative: ${sgn(D.init)}</h2><p>Sets the acting order in Action encounters (combat, chases, traversal). Uses your Dexterity or Wisdom modifier, whichever is higher.</p>
 <label class="frow"><input type="checkbox" ${C.impInit?'checked':''} ${on('toggleFlag','impInit')}> Improved Initiative feat (add proficiency)</label>
 ${D.origins.some(o=>o.n==='Freedom Fighter')?'<p class="rule">Freedom Fighter: advantage on Initiative checks (use Adv).</p>':''}<div class="panel-actions">${rollBtn('Roll initiative','rollInit')}</div>`},
moxie(){return`<h2>Moxie: ${sgn(D.moxie)}</h2><p>Sets the acting order in Plot encounters (social, puzzle and mental challenges). Uses your Intelligence or Charisma modifier, whichever is higher.</p>
 <label class="frow"><input type="checkbox" ${C.impMoxie?'checked':''} ${on('toggleFlag','impMoxie')}> Improved Moxie feat (add proficiency)</label>
 ${D.origins.some(o=>o.n==='Freedom Fighter')?'<p class="rule">Freedom Fighter: disadvantage on Moxie checks (use Dis).</p>':''}<div class="panel-actions">${rollBtn('Roll Moxie','rollMoxie')}</div>`},

senses(){return`<h2>Passive senses</h2><p>Used when the GM checks without asking you to roll: 10 + all modifiers that normally apply. Add 5 with advantage, subtract 5 with disadvantage.</p>
 ${Object.entries(D.pass).map(([k,v])=>`<div class="kv"><span>Passive ${k}</span><b>${v}</b></div>`).join('')}`},

ac(){const b=D.body;return`<h2>Armour class: ${D.ac}</h2><p>How hard you are to hit. An attack that meets or beats your AC hits.</p><h3>Breakdown</h3>
 ${b?`<div class="kv"><span>${esc(b.n)} (${b.a.kind})</span><b>${b.a.ac}</b></div>${b.a.kind==='light'?`<div class="kv"><span>Dexterity</span><b>${sgn(D.m.dex)}</b></div>`:''}`:`<div class="kv"><span>No armour: 10 + Dexterity</span><b>${10+D.m.dex}</b></div>`}
 ${D.addons.map(i=>`<div class="kv"><span>${esc(i.n)}</span><b>+${i.a.ac}</b></div>`).join('')}
 <h3>Other bonus</h3><input type="number" value="${+C.acMod||0}" onchange="setNum('acMod',this.value)"><p class="rule" style="margin-top:6px">For feats like Dodge (+1 in light or no armour) or Defensive Motivation while Inspired.</p>
 ${D.strShort?`<p style="color:var(--red2)">Your Strength is below this armour's requirement (${b.a.str}): disadvantage on attacks and STR/DEX checks, and speed drops to 1m.</p>`:''}
 ${D.armorProfMissing?`<p style="color:var(--red2)">You're not proficient with ${b.a.kind} armour: disadvantage on attacks and on STR/DEX checks and saves. Fix this under Proficiencies.</p>`:''}
 <h3>Cover</h3><ul class="rule"><li>Half cover: +2 AC and DEX saves.</li><li>Three-quarters cover: +5 AC and DEX saves.</li><li>Total cover: can't be targeted directly.</li></ul>
 <div class="panel-actions">${btn('Change armour','setTab',['inventory'])}</div>`},

profs(){const P=C.profs;return`<h2>Proficiencies &amp; training</h2><p class="rule">Filled in from your class when you choose it (Manage character). Tick anything extra from your race, origins or feats.</p>
 <h3>Armour</h3><div class="kitl">${[['light','Light'],['heavy','Heavy']].map(([k,l])=>`<label><input type="checkbox" ${P['armor'+(k==='light'?'Light':'Heavy')]?'checked':''} ${on('toggleArmorProf',k)}> ${l}</label>`).join('')}</div>
 <h3>Weapons</h3><div class="kitl">${Object.entries(WEAPON_GROUPS).map(([k,l])=>`<label><input type="checkbox" ${P.weapons[k]?'checked':''} ${on('toggleWeaponProf',k)}> ${l}</label>`).join('')}</div>
 <h3>Tools</h3><div class="kitl">${TOOLS.map(t=>`<label><input type="checkbox" ${P.tools.includes(t)?'checked':''} ${on('toggleTool',t)}> ${t}</label>`).join('')}</div>
 <h3>Languages</h3>${['Milky Way','Kigal Galaxy'].map(g=>`<div class="lbl" style="margin:8px 0 4px">${g}</div><div class="kitl">${LANGUAGES.filter(l=>l.g===g).map(l=>`<label><input type="checkbox" ${P.languages.includes(l.n)?'checked':''} ${on('toggleLanguage',l.n)}> ${esc(l.n)}${l.note?` <span class="muted" style="font-size:11px">(${esc(l.note)})</span>`:''}</label>`).join('')}</div>`).join('')}
 <h3>Other</h3><textarea rows="2" placeholder="Anything unusual: a specific alien weapon, a local dialect..." oninput="setField('profs.other',this.value)" onchange="commit(false)">${esc(P.other||'')}</textarea>
 <p class="rule" style="margin-top:8px">Wearing armour you're not proficient in gives disadvantage on attacks and on Strength and Dexterity checks and saves.</p>`},

defenses(){const custom=C.defenses,DTL={resist:'Resistance',immune:'Immunity',vuln:'Vulnerability'};
 return`<h2>Defences</h2><p>Resistance halves damage of that type. Immunity means you take none. Vulnerability doubles it. Multiple resistances to the same damage type don't stack.</p>
 <h3>From your race, origins and class</h3>${[...D.immune.map(x=>'Immunity: '+x),...D.defAuto.map(x=>'Resistance: '+x)].map(x=>`<div class="kv"><span>${esc(x)}</span></div>`).join('')||'<p class="muted">None</p>'}
 <h3>Other</h3>${custom.length?custom.map((x,i)=>`<div class="kv"><span>${DTL[x.type]}: ${esc(x.dmg)}${x.note?' ('+esc(x.note)+')':''}</span><button class="btn sm" ${on('removeDefense',i)}>Remove</button></div>`).join(''):'<p class="muted">None yet.</p>'}
 <h3>Add one</h3><div class="fgrid"><div><div class="lbl">Type</div><select id="def-type"><option value="resist">Resistance</option><option value="immune">Immunity</option><option value="vuln">Vulnerability</option></select></div>
 <div><div class="lbl">Damage type</div><select id="def-dmg"><option value="">Choose</option>${DAMAGE_TYPES.map(d=>`<option>${d}</option>`).join('')}</select></div></div>
 <input id="def-note" placeholder="Source, e.g. Inspired, temporary" style="margin-bottom:8px"><button class="btn" onclick="addDefense()">Add</button>`},

conditions(){const eo=!!UI.exhOpen;return`<h2>Conditions</h2><p class="rule">Toggle anything affecting you. Rolls apply their advantage or disadvantage automatically where they can. Use the arrow for a condition's full rules text.</p>
 <h3>Exhaustion</h3><div class="exhrow"><span class="cname">Level</span><div class="exhlv">${['--',1,2,3,4,5,6].map((l,i)=>`<button class="${i===C.exh?'on':''}" ${on('setExh',i)}>${l}</button>`).join('')}</div>
  <button class="chev" ${on('toggleExhInfo')}>${eo?'︿':'⌄'}</button></div>
 ${eo?`<div class="condinfo" style="padding-left:0">${EXH.slice(1).map((t,i)=>`<div class="kv" style="${i+1<=C.exh?'color:var(--red2)':''}"><span>Level ${i+1}</span><span style="text-align:right">${t}</span></div>`).join('')}<p class="rule" style="margin-top:6px">Effects are cumulative. At level 3 and beyond, make a CON save (DC 10 + level) or fall unconscious. A long rest removes 1 level.</p></div>`:''}
 <h3>Conditions</h3>${Object.entries(CONDITIONS).map(([n,t])=>{const on_=C.conds.includes(n),open=!!(UI.condOpen&&UI.condOpen[n]);return`<div class="condrow"><div class="condmain" ${on('toggleCond',n)}><span class="tgl ${on_?'on':''}"></span><span class="cname">${n}</span></div><button class="chev" ${on('toggleCondInfo',n)}>${open?'︿':'⌄'}</button></div>${open?`<div class="condinfo">${esc(t)}</div>`:''}`}).join('')}`},

hp(){const st=D.hpState;let h=`<h2>Hit points</h2>`;
 if(st==='dead')h+=`<p style="color:var(--red2)">This character is dead. If the story brings them back (a sarcophagus, the Ritual of Life, the Nox...), revive them below.</p><div class="panel-actions">${btn('Revive at 1 HP','revive',[],'btn pri')}</div>`;
 if(st==='down'){h+=`<h3>Death saves</h3><div class="fgrid"><div><div class="lbl">Failures</div><div class="ds-row" style="justify-content:flex-start">${[0,1,2].map(i=>`<button class="pip f ${i<C.hp.ds.f?'on':''}" ${on('setDS','f',i<C.hp.ds.f?i:i+1)}></button>`).join('')}</div></div>
  <div><div class="lbl">Successes</div><div class="ds-row" style="justify-content:flex-start">${[0,1,2].map(i=>`<button class="pip s ${i<C.hp.ds.s?'on':''}" ${on('setDS','s',i<C.hp.ds.s?i:i+1)}></button>`).join('')}</div></div></div>
  <div class="panel-actions">${rollBtn('Roll death save','rollDeathSave')}${btn('Mark stable','setStable')}</div>
  <p class="rule">Stabilise DC for a teammate using Medicine at this tension: <b>${TENSION[C.tension].dc}</b>.</p>`}
 h+=`<h3>Current</h3><div class="fgrid"><div><div class="lbl">Current HP</div><input type="number" value="${D.hp}" onchange="setHP(this.value)"></div><div><div class="lbl">Temp HP</div><input type="number" min="0" value="${C.hp.temp||0}" onchange="setNum('hp.temp',this.value)"></div></div>
 <div class="fgrid"><div><div class="lbl">Amount</div><input id="hpamt2" type="number" inputmode="numeric" placeholder="0"></div><div style="display:flex;gap:6px;align-items:flex-end"><button class="btn" style="flex:1;color:var(--grn2);border-color:var(--grn)" onclick="hpApply(1,'hpamt2')">Heal</button><button class="btn danger" style="flex:1" onclick="hpApply(-1,'hpamt2')">Damage</button></div></div>
 <label class="frow"><input type="checkbox" id="critdmg"> Damage is from a critical hit (2 death save failures at 0 HP)</label>
 <h3>Maximum HP: ${D.maxHP}</h3><div class="kv"><span>Calculated (${D.cls?D.cls.n+' d'+D.hdie:'no class'}, level ${D.lvl}, CON ${sgn(D.m.con)}${D.race?', '+D.race.n+' +'+D.race.hp:''}${D.origins.some(o=>o.hpl)?', Drills':''})</span><b>${D.autoMax}</b></div>
 <div class="fgrid"><div><div class="lbl">Max HP modifier</div><input type="number" value="${+C.hp.mod||0}" onchange="setNum('hp.mod',this.value)"></div><div><div class="lbl">Override max HP</div><input type="number" placeholder="--" value="${C.hp.override??''}" onchange="setOverride(this.value)"></div></div>
 ${C.exh>=4?'<p style="color:var(--red2)">Exhaustion 4+: maximum HP is halved.</p>':''}
 <h3>Rules</h3><ul class="rule"><li><b>Healthy</b> is full HP, <b>scuffed</b> is half or more, <b>wounded</b> is below half.</li><li>Temporary HP soak damage first, don't stack (keep the higher), and last until your next long rest.</li>
 <li>At 0 HP you fall unconscious. If the damage left over after reaching 0 equals or exceeds your max HP, you die instantly.</li>
 <li>At the start of each turn at 0 HP, roll a death save: 10+ succeeds. A natural 1 counts as two failures, a natural 20 heals 1 HP. Three successes: stable. Three failures: dead.</li>
 <li>Taking damage at 0 HP is a failure (two on a critical hit). A stable character regains 1 HP after 1d4 hours.</li></ul>
 <p class="rule">Max HP: full hit die + CON at level 1, then the class's per-level HP + CON each level, plus your race's one-off bonus.</p>`;return h},

shortrest(){const J=C.race==='jaffa',hum=C.race==='human_tauri'||C.race==='human_abydonian',heal=D.origins.some(o=>o.n==='Healer');const bonus=Math.max(D.m.con,D.prof);
 const resets=D.res.filter(r=>r.reset==='short');return`<h2>Short rest</h2><p>At least one hour of downtime in a relatively secure place: eating, drinking, reading and tending wounds.</p>
 <h3>Recover</h3>${J?`<p>Kelno'reem: Jaffa with a symbiote don't heal naturally during a short rest.</p>`:`<div class="kv"><span>1d${D.hdie} + ${bonus} (higher of CON or proficiency)${hum?' + TD (Recovery)':''}${heal?' + '+D.prof+' (Soothe)':''}</span><b>HP</b></div>
  <label class="frow" style="margin-top:6px"><input type="checkbox" id="sr-auto" checked> Roll and apply healing automatically</label>`}
 <p class="rule">A Med Kit can heal each character once per short rest on top of this (1d8 wounded or 1d4 scuffed, doubled dice if proficient).</p>
 <h3>Resets</h3>${resets.length?resets.map(r=>`<div class="kv"><span>${esc(r.name)}</span><b>${r.used?'Recovers '+r.used:'Full'}</b></div>`).join(''):'<p class="muted">Nothing on your sheet resets on a short rest.</p>'}
 <div class="panel-actions">${btn('Take short rest','takeShortRest',[],'btn pri')}</div>`},
longrest(){const bonus=Math.max(D.m.con,D.prof);let heal=`${D.lvl}d${D.hdie} + ${bonus} (hit dice equal to level, plus higher of CON or proficiency)`;
 if(C.race==='jaffa')heal=`${D.lvl} x ${D.hdie} + ${bonus} (Kelno'reem: hit dice roll maximum)`;if(C.race==='tokra'||C.race==='tokra_pangaran')heal='Full HP (Regeneration)';
 const resets=D.res.filter(r=>r.reset==='short'||r.reset==='long');return`<h2>Long rest</h2><p>At least 8 hours of sleep or light activity, with no more than 2 hours on watch. An hour of walking or any fighting interrupts it. Only one long rest per 24 hours.</p>
 ${D.hp<1?'<p style="color:var(--red2)">You need at least 1 HP at the start of a long rest to benefit from it.</p>':''}
 <h3>Recover</h3><div class="kv"><span>${heal}</span><b>HP</b></div>
 <div class="kv"><span>Exhaustion</span><b>${C.exh?C.exh+' → '+(C.exh-1):'None'}</b></div><div class="kv"><span>Determination</span><b>${D.dp} → ${D.dpBase}</b></div>
 <div class="kv"><span>Temporary HP (expire)</span><b>${C.hp.temp||0} → 0</b></div><div class="kv"><span>Ability score damage</span><b>Heals 1 point</b></div>
 <h3>Resets</h3>${resets.length?resets.map(r=>`<div class="kv"><span>${esc(r.name)}</span><b>${r.used?'Recovers '+r.used:'Full'}</b></div>`).join(''):'<p class="muted">No trackers to reset.</p>'}
 <div class="panel-actions">${D.hp<1?'':btn('Take long rest','takeLongRest',[],'btn pri')}</div>`},

newmission(){const mres=D.res.filter(r=>r.reset==='mission');return`<h2>Start a new mission</h2><p>Resets anything that works once per mission${C.cls==='scientist'?', and sets your Eureka points to '+(D.lvl>=5?Math.floor(D.prof/2)+' (Casual Genius)':'0 (unspent Eureka is lost between missions)'):''}.</p>
 ${mres.map(r=>`<div class="kv"><span>${esc(r.name)}</span><b>Resets</b></div>`).join('')}<p class="rule">It doesn't heal you or change your downtime facility. Take a long rest separately if the GM says you've had one.</p>
 <div class="panel-actions">${btn('Start new mission','newMission',[],'btn pri')}</div>`},

manage(){const oo=(slot)=>{const cur=C.origins[slot];const other=C.origins[1-slot];const oc=ORIGINS[other]?.c;
  return`<select onchange="setOrigin(${slot},this.value)"><option value="">None</option>${['Biome','Background','Racial'].map(cat=>`<optgroup label="${cat}${oc===cat?' (used by your other origin)':''}">${Object.entries(ORIGINS).filter(([n,o])=>o.c===cat).map(([n,o])=>{const bad=(oc===cat)||(o.req&&!o.req.includes(C.race));return`<option value="${esc(n)}" ${cur===n?'selected':''} ${bad&&cur!==n?'disabled':''}>${esc(n)}</option>`}).join('')}</optgroup>`).join('')}</select>`};
 return`<h2>Manage character</h2><div class="lbl">Name</div><input value="${esc(C.name)}" oninput="setField('name',this.value);renderHeader()" style="margin-bottom:10px">
 <div class="lbl">Portrait</div><div class="frow"><div class="portrait" style="background-image:${C.portrait?'url('+C.portrait+')':'none'}"></div><button class="btn" onclick="$('portraitUp').click()">Upload</button>${C.portrait?btn('Remove','setVal',['portrait',''],'btn sm'):''}<input type="file" id="portraitUp" class="hidden" accept="image/*" onchange="loadPortrait(event)"></div>
 <div class="fgrid"><div><div class="lbl">Race</div><select onchange="setRace(this.value)"><option value="">Choose race</option>${Object.entries(RACES).map(([k,r])=>`<option value="${k}" ${C.race===k?'selected':''}>${esc(r.n)}</option>`).join('')}</select></div>
 <div><div class="lbl">Class</div><select onchange="setClass(this.value)"><option value="">Choose class</option>${Object.entries(CLASSES).map(([k,c])=>`<option value="${k}" ${C.cls===k?'selected':''}>${c.n}</option>`).join('')}</select></div></div>
 <div class="fgrid"><div><div class="lbl">Level</div><input type="number" min="1" max="20" value="${D.lvl}" onchange="setLevel(this.value)"></div><div><div class="lbl">Hit die</div><input disabled value="d${D.hdie}"></div></div>
 <h3>Origins (two, different categories)</h3><div class="fgrid"><div>${oo(0)}</div><div>${oo(1)}</div></div>
 ${D.origins.map(o=>`<p class="rule" style="margin-bottom:4px"><b>${esc(o.n)}</b>: ${esc(o.a)}. ${esc(o.ab)}.</p>`).join('')}
 <h3>Ability scores</h3><div class="fgrid" style="grid-template-columns:repeat(3,1fr)">${ABILS.map(a=>`<div><div class="lbl">${AB(a.k)}</div><input type="number" min="1" max="30" value="${C.scores[a.k]}" onchange="setScore('${a.k}',this.value)"></div>`).join('')}</div>
 <p class="rule">Enter final scores including your race's +2 and any origin +1. Point buy is 27 points, or roll 4d6 and drop the lowest die.</p>
 ${D.race?`<p class="rule">${esc(D.race.n)}: ${esc(D.race.asi)}. Proficiencies: ${esc(D.race.prof)}.</p>`:''}
 ${C.cls==='soldier'&&D.lvl>=3?`<h3>Improved Critical weapon type</h3><select onchange="setVal('impCrit',this.value)"><option value="">Choose</option>${['common','sidearms','longarms','shotguns','bows','martial','jaffa'].map(k=>`<option ${C.impCrit===k?'selected':''}>${k}</option>`).join('')}</select>`:''}
 <h3>Class defaults</h3><p class="rule">Choosing a class ticks its saves and skills and fills proficiencies. Re-apply if you've cleared them.</p><div class="panel-actions" style="margin-top:0">${D.cls?btn('Re-apply '+D.cls.n+' defaults','applyClassDefaults',[],'btn sm'):''}</div>`},

item(id){const it=C.inv.find(i=>i.id===id);if(!it)return'<p class="muted">Item not found.</p>';
 let h=`<h2>${esc(it.n)}</h2><p class="rule">${esc(it.src||'Custom')} • Tech level ${it.tl??'-'}${it.kit?' • Base kit':''}</p>${it.d?`<p>${esc(it.d)}</p>`:''}`;
 if(it.w){h+=`<h3>Attacks</h3>`+it.w.modes.map((md,mi)=>{const s=modeStats(it,mi);return`<div class="kv"><span>${esc(md[0])} • ${esc(s.rng||'1m')} • ${esc(s.dt)}</span><span style="display:flex;gap:5px"><button class="rbtn" ${on('rollAttack',id,mi)}>${sgn(s.hit)}</button>${s.dmgExpr!=='0'?`<button class="rbtn" ${on('rollWeaponDmg',id,mi,false)}>${esc(s.dmgExpr)}</button><button class="rbtn" title="Critical damage" ${on('rollWeaponDmg',id,mi,true)}>Crit</button>`:''}</span></div>`}).join('');
  if(it.w.sp)h+=`<p class="rule" style="margin-top:8px">${esc(it.w.sp)}</p>`}
 if(it.a)h+=`<h3>Armour</h3><div class="kv"><span>Type</span><b>${it.a.kind==='addon'?'Add-on':it.a.kind}</b></div><div class="kv"><span>AC</span><b>${it.a.kind==='addon'?'+'+it.a.ac:it.a.ac+(it.a.kind==='light'?' + DEX':'')}</b></div>${it.a.str?`<div class="kv"><span>Strength needed</span><b>${it.a.str}</b></div>`:''}<div class="kv"><span>Loadout</span><b>${it.a.kind==='addon'?(it.a.load?it.a.load:'0'):it.a.load+' + STR'}</b></div>${it.a.stealth?'<div class="kv"><span>Stealth</span><b>Disadvantage</b></div>':''}`;
 h+=`<div class="panel-actions">${(it.w||it.a)?btn(it.eq?'Unequip':'Equip','toggleEquip',[id]):''}</div>`;
 h+=custBlock('item-'+id,`${it.w?`<div class="fgrid"><div><div class="lbl">Proficient</div><select onchange="setItem('${id}','prof',this.value)">${[['auto','Automatic ('+(weaponProf(it.w.pc)?'yes':'no')+')'],['yes','Yes'],['no','No']].map(([v,l])=>`<option value="${v}" ${it.prof===v?'selected':''}>${l}</option>`).join('')}</select></div>
   <div><div class="lbl">Proficiency group</div><select onchange="setItemW('${id}','pc',this.value)">${['common','bows','sidearms','longarms','shotguns','martial','jaffa','gunnery','explosives'].map(k=>`<option ${it.w.pc===k?'selected':''}>${k}</option>`).join('')}</select></div></div>`:''}
  <div class="fgrid" style="margin-top:${it.w?8:0}px"><div><div class="lbl">Name</div><input value="${esc(it.n)}" onchange="setItem('${id}','n',this.value)"></div><div><div class="lbl">Quantity</div><input type="number" min="0" value="${it.qty||1}" onchange="setItem('${id}','qty',+this.value)"></div>
   <div><div class="lbl">Bulk each</div><input type="number" min="0" value="${it.b||0}" onchange="setItem('${id}','b',+this.value)"></div><div><div class="lbl">Tech level</div><input type="number" min="0" max="5" value="${it.tl??''}" onchange="setItem('${id}','tl',+this.value)"></div></div>
   ${it.w?`<div class="fgrid">${it.w.modes.map((md,mi)=>`<div><div class="lbl">${esc(md[0])} damage</div><input value="${esc(md[2])}" onchange="setMode('${id}',${mi},2,this.value)"></div>`).join('')}</div><p class="rule">Damage dice like 2d6, 1d8+TD. Your ability modifier is added automatically.</p>`:''}
   <div class="lbl">Notes</div><textarea rows="3" onchange="setItem('${id}','notes',this.value)">${esc(it.notes||'')}</textarea>
   <label class="frow" style="margin-top:8px"><input type="checkbox" ${it.kit?'checked':''} onchange="setItem('${id}','kit',this.checked)"> Part of issued base kit (no bulk)</label>
   <div class="panel-actions">${btn('Remove','removeItem',[id],'btn danger')}</div>`);
 return h},

additem(){const q=UI.addq.toLowerCase(),t=UI.addt;const list=allCatalog().filter(c=>(t==='all'||c.t===t)&&(!q||c.n.toLowerCase().includes(q)||(c.d||'').toLowerCase().includes(q)));
 return`<h2>Add items</h2><p class="rule">Everything from the rulebook, plus anything ${isGM?'you\'ve':'your GM has'} added to the campaign list below. An amber note means it's flagged, not proficient, too heavy, or alien tech needing GM sign-off, but you can still add it. Items already in your inventory show a quantity stepper here instead of Add.</p>
 <input id="addq" placeholder="Search: sidearm, med kit, staff..." value="${esc(UI.addq)}" oninput="UI.addq=this.value;renderAddList()">
 <div class="filters" style="margin-top:8px">${[['all','All'],['weapon','Weapons'],['armor','Armour'],['gear','Gear']].map(([k,l])=>`<button class="${t===k?'on':''}" ${on('setAddType',k)}>${l}</button>`).join('')}</div>
 <div id="addlist">${addListHtml(list)}</div>
 <h3>Custom item (just for you)</h3><div class="fgrid"><div><div class="lbl">Name</div><input id="ci-n"></div><div><div class="lbl">Type</div><select id="ci-t"><option value="gear">Gear</option><option value="weapon">Weapon</option></select></div>
 <div><div class="lbl">Bulk</div><input id="ci-b" type="number" value="1"></div><div><div class="lbl">Damage (weapons)</div><input id="ci-d" placeholder="1d8"></div></div>
 <div class="lbl">Description</div><textarea id="ci-desc" rows="2"></textarea><div class="panel-actions"><button class="btn pri" onclick="addCustomItem()">Add custom item</button></div>
 ${isGM?`<h3>Campaign items (everyone can see these)</h3><p class="rule">Add loot here once a player finds or is given it, and they can pick it up themselves from this same list, on their own device.</p>

function itemTags(c){const tags=[];
 if(c.t==='weapon'&&!weaponProf(c.w.pc))tags.push('Not proficient');

 if(c.t==='armor'&&c.a.str&&C.scores.str<c.a.str)tags.push('Needs STR '+c.a.str);
 if(c.src==='Alien')tags.push('GM approval');
 return tags}

 return`<div class="res"><div class="rn"><b>${esc(c.n)}</b><small>${c.t==='weapon'?c.w.modes.map(m=>m[2]).join(' / ')+' • ':''}${c.t==='armor'?(c.a.kind==='addon'?'+':'AC ')+c.a.ac+' • ':''}Bulk ${c.b} • TL ${c.tl} • ${esc(c.src)}${tags.length?' • <span style="color:var(--amber2)">'+tags.join(', ')+'</span>':''}</small></div>
 ${ex?`<div class="ctr"><button ${on('adjCatQty',c.n,-1)}>−</button><span class="mono" style="min-width:20px;text-align:center">${ex.qty||1}</span><button ${on('adjCatQty',c.n,1)}>+</button></div>`:`<button class="btn sm" ${on('addCatItem',c.n)}>Add</button>`}</div>`}).join(''):'<p class="muted">No matches.</p>'}

function setPath(o,path,v){const ks=path.split('.');let t=o;ks.slice(0,-1).forEach(k=>{if(t[k]==null)t[k]={};t=t[k]});t[ks[ks.length-1]]=v}
function setField(path,v){setPath(C,path,v);scheduleSave()}
function setVal(path,v){setPath(C,path,v);commit()}
function setNum(path,v){setPath(C,path,v===''?0:+v);commit()}
function setRollMode(m){UI.rollMode=UI.rollMode===m?'normal':m;renderRollMode()}
function setTheme(k){C.theme=k;applyTheme(k);commit(false);if(UI.panel.k==='appearance')renderSide()}
function applyTheme(k){const t=THEMES[k]||THEMES.sgc_dark;const r=document.documentElement.style;for(const v in t)r.setProperty('--'+v,t[v]);r.setProperty('--bodyBg',t.bodyBg||t.bg);applyAppearance()}
function applyAppearance(){document.body.className=document.body.className.replace(/\bbs-\S+/g,'').trim();
 document.body.classList.add('bs-'+(C.borderStyle||'hud'));document.body.classList.toggle('nightmode',!!C.nightMode);
 document.body.style.backgroundImage=C.bgImage?`linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.7)),url(${C.bgImage})`:'';
 document.body.style.backgroundSize=C.bgImage?'cover':'';document.body.style.backgroundAttachment=C.bgImage?'fixed':''}
function themeLabel(k){return k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).replace('Sgc','SGC').replace('Goauld',"Goa'uld").replace('Tokra',"Tok'ra").replace('Kethalis',"Keth'alis")}
function setBorderStyle(k){C.borderStyle=k;applyAppearance();commit(false)}
function toggleNight(){C.nightMode=!C.nightMode;applyAppearance();commit(false)}
function clearBg(){C.bgImage='';applyAppearance();commit(false);renderSide()}
function loadBgImage(ev){const f=ev.target.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);
 img.onload=()=>{const s=1280,cv=document.createElement('canvas');const r=Math.min(1,s/Math.max(img.width,img.height));cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);C.bgImage=cv.toDataURL('image/jpeg',.75);URL.revokeObjectURL(url);applyAppearance();commit(false);renderSide()};img.src=url}

 c.skills.forEach(s=>{if(!C.skillProf[s])C.skillProf[s]=1});
 const upg=upgradeProfs({armor:c.armor,weapons:c.weapons,tools:c.tools,languages:C.profs.languages.join(', ')});

 commit();if(!quiet)toast(c.n+' defaults applied')}

  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);C.portrait=cv.toDataURL('image/jpeg',.85);URL.revokeObjectURL(url);commit()};img.src=url}

// HP & death
function hpApply(sign,inputId='hpamt'){const el=$(inputId);const n=Math.abs(parseInt(el&&el.value)||0);if(!n)return;
 if(sign>0)heal(n,'Healed');else damage(n,!!($('critdmg')&&$('critdmg').checked));if(el)el.value=''}
function heal(n,why){if(C.hp.dead)return toast('Dead characters can\'t be healed');const before=D.hp;C.hp.cur=Math.min(D.maxHP,D.hp+n);
 if(C.hp.cur>0){C.hp.ds={s:0,f:0};C.hp.stable=false}logInfo(why||'Healed','+'+(C.hp.cur-before)+' HP ('+before+' → '+C.hp.cur+')');commit()}
function damage(n,crit){if(C.hp.dead)return;let left=n;const t=+C.hp.temp||0;if(t){const u=Math.min(t,left);C.hp.temp=t-u;left-=u}
 const cur=D.hp;let msg='';
 if(cur>0){const nc=cur-left;if(nc>0){C.hp.cur=nc;msg=cur+' → '+nc}else{C.hp.cur=0;const over=-nc;
   if(over>=D.maxHP){C.hp.dead=true;msg='Massive damage: '+over+' left over after 0 HP equals or exceeds max HP. Killed outright.'}else{C.hp.ds={s:0,f:0};C.hp.stable=false;msg='Down to 0 HP and unconscious. Start death saves.'}}}
 else if(left>0){if(left>=D.maxHP){C.hp.dead=true;msg='Massive damage at 0 HP. Killed outright.'}else{C.hp.stable=false;C.hp.ds.f+=crit?2:1;msg='Damage at 0 HP: '+(crit?'two death save failures':'one death save failure');if(C.hp.ds.f>=3){C.hp.dead=true;msg+='. Three failures: dead.'}}}
 logInfo('Took '+n+' damage'+(t?' ('+Math.min(t,n)+' absorbed by temp HP)':''),msg||'Absorbed by temporary HP');commit()}
function setHP(v){C.hp.cur=clamp(parseInt(v)||0,0,D.maxHP);if(C.hp.cur>0){C.hp.ds={s:0,f:0};C.hp.stable=false}commit()}
function setOverride(v){C.hp.override=v===''?null:+v;commit()}
function rollDeathSave(){if(C.hp.stable)return toast('You are stable. No death saves needed.');const n=die(20);let msg;
 if(n===20){C.hp.cur=1;C.hp.ds={s:0,f:0};msg='Natural 20! You regain 1 HP and wake up.'}
 else if(n===1){C.hp.ds.f+=2;msg='Natural 1: two failures.'}else if(n>=10){C.hp.ds.s++;msg='Success.'}else{C.hp.ds.f++;msg='Failure.'}
 if(C.hp.ds.f>=3){C.hp.dead=true;msg+=' Three failures: dead.'}else if(C.hp.ds.s>=3){C.hp.stable=true;C.hp.ds={s:0,f:0};msg+=' Three successes: stable.'}
 logRoll('Death save','',n,'1d20 ('+n+') • '+msg,n===20?'crit':n===1?'fumble':'');commit()}
function setDS(k,v){C.hp.ds[k]=clamp(v,0,3);if(C.hp.ds.f>=3)C.hp.dead=true;if(C.hp.ds.s>=3){C.hp.stable=true;C.hp.ds={s:0,f:0}}commit()}
function setStable(){C.hp.stable=true;C.hp.ds={s:0,f:0};logInfo('Stabilised','Unconscious but no longer making death saves. Regain 1 HP after 1d4 hours.');commit()}
function revive(){C.hp.dead=false;C.hp.cur=1;C.hp.ds={s:0,f:0};C.hp.stable=false;logInfo('Revived','Back at 1 HP.');commit()}

function setDP(v){C.dp=v;commit()}

// rests
function takeShortRest(){const auto=$('sr-auto')?$('sr-auto').checked:false;let msg=[];
 if(C.race!=='jaffa'&&auto&&!C.hp.dead&&D.hp>0){let ex='1d'+D.hdie+'+'+Math.max(D.m.con,D.prof);if(C.race==='human_tauri'||C.race==='human_abydonian')ex+='+TD';if(D.origins.some(o=>o.n==='Healer'))ex+='+'+D.prof;
  const r=rollExpr(ex);const b=D.hp;C.hp.cur=Math.min(D.maxHP,D.hp+r.total);msg.push('Healed '+(C.hp.cur-b)+' ('+r.text+')')}
 resetRes(['short']);logInfo('Short rest',msg.join('. ')||'Short-rest abilities reset.');UI.panel={k:'log'};commit()}
function takeLongRest(){if(D.hp<1)return toast('You need at least 1 HP to benefit from a long rest');const b=D.hp;let r;
 if(C.race==='tokra'||C.race==='tokra_pangaran')C.hp.cur=D.maxHP;
 else{const bonus=Math.max(D.m.con,D.prof);r=C.race==='jaffa'?{total:D.lvl*D.hdie+bonus,text:D.lvl+' x '+D.hdie+' + '+bonus+' (Kelno\'reem)'}:rollExpr(D.lvl+'d'+D.hdie+'+'+bonus);C.hp.cur=Math.min(D.maxHP,b+r.total)}
 const ex=C.exh;C.exh=Math.max(0,C.exh-1);C.dp=null;C.hp.temp=0;C.hp.ds={s:0,f:0};C.hp.stable=false;resetRes(['short','long']);
 D=derive();C.hp.cur=Math.min(D.maxHP,C.hp.cur);
 logInfo('Long rest','Healed '+(C.hp.cur-b)+(r?' ('+r.text+')':' (Regeneration)')+'. '+(ex?'Exhaustion '+ex+' → '+C.exh+'. ':'')+'DP reset to '+D.dpBase+'. Temp HP cleared.');UI.panel={k:'log'};commit()}
function newMission(){resetRes(['mission']);if(C.cls==='scientist')C.eureka=D.lvl>=5?Math.floor(D.prof/2):0;logInfo('New mission','Per-mission abilities reset.');UI.panel={k:'log'};commit()}

function addCustomItem(){const n=$('ci-n').value.trim();if(!n)return toast('Give the item a name');const t=$('ci-t').value,dmg=$('ci-d').value.trim()||'1d6';

function toggleEquip(id){const it=C.inv.find(i=>i.id===id);if(!it)return;it.eq=!it.eq;

// rolls
function rollAbility(k){rollD20(ABN(k),'check',D.m[k],{ab:k})}
function rollSave(k){rollD20(ABN(k),'save',D.saves[k],{ab:k})}
function rollSkill(n){const s=D.skills[n];rollD20(n,'check',s.v,{ab:n==='Stealth'?'stealth':s.ab})}
function rollInit(){rollD20('Initiative','check',D.init,{ab:'dex'})}
function rollMoxie(){rollD20('Moxie','check',D.moxie,{ab:'int'})}
function rollTD(){const r=rollExpr('TD');logRoll('Tension die ('+C.tension+')','',r.total,r.text,'')}
function rollPlain(title,expr){const r=rollExpr(expr);logRoll(title,'',r.total,r.text,'')}
function rollAttack(id,mi){const it=C.inv.find(i=>i.id===id);const s=modeStats(it,mi);if(it.w.cap){if((it.ammo??it.w.cap)<=0)toast('Out of ammo. Reload first.');else it.ammo=(it.ammo??it.w.cap)-1}
 const r=rollD20(it.n+(it.w.modes.length>1?' ('+it.w.modes[mi][0]+')':''),'attack',s.hit,{critOn:s.critOn});if(r.crit)toast('Critical hit! Roll crit damage from the item panel.');if(it.w.cap)commit(false)}
function rollWeaponDmg(id,mi,crit){const it=C.inv.find(i=>i.id===id);const s=modeStats(it,mi);rollDamage(it.n,s.dmgExpr,crit)}
function rollUnarmedHit(n,hit){rollD20(n,'attack',hit,{})}
function rollUnarmedDmg(n,dmg){rollDamage(n,dmg,false)}
function clearLog(){UI.log=[];renderSide()}

// backup
function exportData(){const b=new Blob([JSON.stringify(C,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(C.name||'character').replace(/\s+/g,'-').toLowerCase()+'-phoenix.json';a.click();toast('Backup downloaded')}
function importData(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{try{C=migrate(JSON.parse(e.target.result));applyTheme(C.theme);commit();toast('Backup restored')}catch(x){toast('That file couldn\'t be read')}};r.readAsText(f)}

// ============================================================
// CLOUD: login + save/load (Supabase)
// Paste your anon public key below: Supabase dashboard ->
// Settings -> API -> Project API keys -> "anon public".
// Never use the service_role key here.
// ============================================================
const SUPABASE_URL='https://zgkohcxskfxmsxmqkgoa.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_eH_SkZVCFKUD4wEWZKhyjw_3ErxAfDy';
let sb=null,charId=null,saveT=null,started=false,offline=false,isGM=false,entering=false,CAMPAIGN_ITEMS=[];
try{if(window.supabase&&!SUPABASE_ANON_KEY.startsWith('PASTE'))sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY)}catch(e){sb=null}

function loginMsg(t){$('login-msg').innerHTML=t}
async function handleLogin(){if(!sb)return loginMsg('This copy of the file isn\'t connected to the cloud (the anon key is missing or wrong). Log in won\'t work until that\'s fixed.');const email=$('login-email').value.trim(),password=$('login-pass').value;if(!email||!password)return loginMsg('Enter your email and password.');
 loginMsg('Checking...');const{error}=await sb.auth.signInWithPassword({email,password});if(error)loginMsg(esc(error.message))}
async function handleSignup(){if(!sb)return loginMsg('This copy of the file isn\'t connected to the cloud (the anon key is missing or wrong). Sign up won\'t work until that\'s fixed.');const email=$('login-email').value.trim(),password=$('login-pass').value;if(!email||!password)return loginMsg('Enter an email and password.');
 loginMsg('Creating account...');const{data,error}=await sb.auth.signUp({email,password});if(error)return loginMsg(esc(error.message));if(!data.session)loginMsg('Account created. Check your email to confirm, then log in.')}
async function handleLogout(){if(started)await saveNow();if(sb)await sb.auth.signOut();else location.reload()}

function startApp(row){C=migrate(row?row.sheet_data:null);if(!C.inv.length&&(!row||!row.sheet_data))C.inv=starterKit();applyTheme(C.theme);D=derive();
 $('login-screen').classList.add('hidden');$('picker-screen').classList.add('hidden');$('app').classList.remove('hidden');started=true;UI.open=isWide();UI.tab='actions';UI.panel={k:'log'};
 renderMain();applySide();renderSide();setSaveStat(offline?'Offline':'Saved');loadCampaignItems()}

async function enterSheetFor(user){if(started||entering)return;entering=true;loginMsg('Checking your access...');
 const prof=await sb.from('profiles').select('role').eq('id',user.id).single();
 isGM=!prof.error&&prof.data&&prof.data.role==='gm';
 if(isGM){showPicker();return}
 loginMsg('Loading character...');
 let{data:rows,error}=await sb.from('characters').select('*').eq('owner_id',user.id).order('created_at').limit(1);if(error){entering=false;return loginMsg('Couldn\'t load your character: '+esc(error.message))}
 let row=rows&&rows[0];if(!row){const ins=await sb.from('characters').insert({owner_id:user.id,name:'Unnamed Character',sheet_data:{}}).select().single();if(ins.error){entering=false;return loginMsg('Couldn\'t create a character: '+esc(ins.error.message))}row=ins.data}
 charId=row.id;startApp(row)}

// ---- GM: character picker ----
async function showPicker(){if(started)await saveNow();started=false;$('app').classList.add('hidden');$('login-screen').classList.add('hidden');$('picker-screen').classList.remove('hidden');
 $('picker-msg').textContent='Loading characters...';
 const{data,error}=await sb.from('characters').select('*').order('updated_at',{ascending:false});
 if(error){$('picker-msg').textContent='Couldn\'t load characters: '+error.message;return}
 $('picker-msg').textContent=data.length?'':'No characters yet.';
 $('picker-list').innerHTML=data.map(r=>`<button class="pickrow" onclick="openCharacter('${r.id}')"><div class="pn"><b>${esc(r.name||'Unnamed Character')}</b><small>${esc(r.class_name||'No class')} • Level ${r.level||1} • Saved ${ago(new Date(r.updated_at).getTime())}</small></div></button>`).join('')}
async function openCharacter(id){$('picker-msg').textContent='Opening...';const{data,error}=await sb.from('characters').select('*').eq('id',id).single();
 if(error){$('picker-msg').textContent='Couldn\'t open that character: '+error.message;return}charId=id;startApp(data)}

function offlineStart(){offline=true;isGM=true;let d=null;try{d=JSON.parse(localStorage.getItem('sgc-v2-local')||'null')}catch(e){}startApp(d?{sheet_data:d}:null)}

function setSaveStat(t){const e=$('savestat');if(e)e.textContent=t}
function scheduleSave(){if(!started)return;setSaveStat('Unsaved');clearTimeout(saveT);saveT=setTimeout(saveNow,1200)}
async function saveNow(){if(!started)return;clearTimeout(saveT);try{localStorage.setItem(charId?'sgc-v2-cache-'+charId:'sgc-v2-local',JSON.stringify(C))}catch(e){}
 if(!sb||!charId){setSaveStat('Saved on device');return}setSaveStat('Saving...');
 const{error}=await sb.from('characters').update({sheet_data:C,name:C.name||'Unnamed Character',class_name:CLASSES[C.cls]?.n||null,level:D.lvl,updated_at:new Date().toISOString()}).eq('id',charId);
 setSaveStat(error?'Save failed':'Saved');if(error)toast('Cloud save failed. Your changes are kept on this device.')}
window.addEventListener('beforeunload',()=>{if(saveT)saveNow()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)saveNow()});

// ---- Campaign items: GM-curated shared list every player can browse and self-add from ----
async function loadCampaignItems(){if(sb){const r=await sb.from('campaign_items').select('*').order('created_at',{ascending:false});if(!r.error)CAMPAIGN_ITEMS=r.data||[]}
 else{try{CAMPAIGN_ITEMS=JSON.parse(localStorage.getItem('sgc-campaign-items')||'[]')}catch(e){CAMPAIGN_ITEMS=[]}}
 if(UI.panel.k==='additem')renderSide()}
function allCatalog(){return[...CAT,...CAMPAIGN_ITEMS.map(r=>({...(r.data||{}),n:(r.data&&r.data.n)||r.name,src:'Campaign',_row:r.id}))]}
async function addCampaignItem(){const n=$('gi-n').value.trim();if(!n)return toast('Give the item a name');
 const t=$('gi-t').value,dmg=$('gi-d').value.trim();
 const data={n,t,src:'Campaign',tl:+$('gi-tl').value||2,b:+$('gi-b').value||1,d:$('gi-desc').value,
  w:t==='weapon'?{modes:[['Attack','ranged',dmg||'1d6','Piercing','',0]],pc:'common'}:null,a:null};
 if(sb&&isGM){const ins=await sb.from('campaign_items').insert({name:n,data}).select().single();if(ins.error)return toast('Couldn\'t add it: '+ins.error.message);CAMPAIGN_ITEMS.unshift(ins.data)}
 else{CAMPAIGN_ITEMS.unshift({id:uid(),name:n,data,created_at:new Date().toISOString()});try{localStorage.setItem('sgc-campaign-items',JSON.stringify(CAMPAIGN_ITEMS))}catch(e){}}
 $('gi-n').value='';$('gi-desc').value='';$('gi-d').value='';toast(n+' added to the campaign list');renderSide()}
async function removeCampaignItem(id){if(sb&&isGM){const del=await sb.from('campaign_items').delete().eq('id',id);if(del.error)return toast('Couldn\'t remove it: '+del.error.message)}
 CAMPAIGN_ITEMS=CAMPAIGN_ITEMS.filter(x=>x.id!==id);if(!sb)try{localStorage.setItem('sgc-campaign-items',JSON.stringify(CAMPAIGN_ITEMS))}catch(e){}renderSide()}

if(sb){sb.auth.onAuthStateChange((ev,session)=>{if(session&&session.user)enterSheetFor(session.user);else if(ev==='SIGNED_OUT')location.reload()})}
else{loginMsg(window.supabase?'The cloud key hasn\'t been added to this file yet.<br><button class="btn" style="margin-top:8px" onclick="offlineStart()">Continue on this device only</button>'
 :'Can\'t reach the server right now.<br><button class="btn" style="margin-top:8px" onclick="offlineStart()">Continue on this device only</button>')}
</script>
