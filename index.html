function derive(){const d={};const lvl=d.lvl=clamp(+C.level||1,1,20);const P=d.prof=PROF_BY_LVL[lvl-1];
 const m=d.m={};ABILS.forEach(a=>m[a.k]=modOf(C.scores[a.k]));
 const cls=d.cls=CLASSES[C.cls]||null,race=d.race=RACES[C.race]||null;
 d.hdie=cls?cls.hdie:8;
 d.origins=C.origins.filter(Boolean).map(n=>ORIGINS[n]?{n,...ORIGINS[n]}:null).filter(Boolean);
 const drills=d.origins.some(o=>o.hpl)?lvl:0;
 d.autoMax=cls?(cls.hdie+m.con)+(lvl-1)*(cls.lvlhp+m.con)+(race?race.hp:0)+drills:0;
 const base=(C.hp.override!=null&&C.hp.override!=='')?+C.hp.override:d.autoMax+(+C.hp.mod||0);
 d.maxHP=Math.max(1,C.exh>=4?Math.ceil(base/2):base);
 d.hp=C.hp.cur==null?d.maxHP:clamp(+C.hp.cur,0,d.maxHP);
 d.hpState=C.hp.dead?'dead':d.hp<=0?'down':d.hp>=d.maxHP?'healthy':d.hp>=d.maxHP/2?'scuffed':'wounded';
 // armour & load
 const eq=C.inv.filter(i=>i.eq&&i.a);d.body=eq.find(i=>i.a.kind!=='addon')||null;d.addons=eq.filter(i=>i.a.kind==='addon');
 d.acBase=d.body?(d.body.a.kind==='light'?d.body.a.ac+m.dex:d.body.a.ac):10+m.dex;
 d.ac=d.acBase+d.addons.reduce((s,i)=>s+(+i.a.ac||0),0)+(+C.acMod||0);
 d.strShort=d.body&&d.body.a.str&&C.scores.str<d.body.a.str;
 d.armorProfMissing=d.body?!armorProf(d.body.a.kind):false;
 d.stealthDis=eq.some(i=>i.a.stealth);
 d.loadCap=Math.max(0,(d.body?+d.body.a.load||0:0)+m.str+d.addons.reduce((s,i)=>s+(+i.a.load||0),0)+d.origins.reduce((s,o)=>s+(o.bulk||0),0));
 d.bulk=C.inv.filter(i=>!i.kit).reduce((s,i)=>s+(+i.b||0)*(+i.qty||1),0);
 let spd=6+d.origins.reduce((s,o)=>s+(o.spd||0),0)+(+C.speedMod||0)-(d.body&&d.body.a.kind==='heavy'?2:0);
 if(d.strShort)spd=1;if(C.exh>=2)spd=Math.floor(spd/2);if(C.exh>=5)spd=0;
 if(C.conds.some(c=>['Grappled','Restrained'].includes(c)))spd=0;else if(C.conds.includes('Entangled'))spd=Math.floor(spd/2);d.speed=spd;
 d.init=Math.max(m.dex,m.wis)+(C.impInit?P:0);d.moxie=Math.max(m.int,m.cha)+(C.impMoxie?P:0);
 d.dpBase=P+(cls?cls.det:0);d.dp=C.dp==null?d.dpBase:Math.max(0,+C.dp);
 const fac=C.facility||{},fr=+fac.rating||0;
 d.saves={};ABILS.forEach(a=>{d.saves[a.k]=m[a.k]+(C.saveProf[a.k]?P:0)+(fac.name==='Mess Hall'&&(a.k==='con'||a.k==='wis')?fr:0)});
 d.skills={};SKILLS.forEach(s=>{const cand=[s.k];d.origins.forEach(o=>{if(o.sw&&o.sw[0]===s.n)cand.push(o.sw[1])});
  if(C.cls==='engineer'&&lvl>=4&&s.n==='Perception')cand.push('int');
  if(C.race==='tokra_pangaran'&&s.n==='Persuasion')cand.push('int','wis');
  let ab=C.skillAbil[s.n]&&m[C.skillAbil[s.n]]!=null?C.skillAbil[s.n]:cand.reduce((b,k)=>m[k]>m[b]?k:b,cand[0]);
  const pl=+C.skillProf[s.n]||0;let half=0;
  if(!pl&&C.cls==='scientist'&&lvl>=3&&['int','wis','cha'].includes(ab))half=Math.floor(P/2);
  d.skills[s.n]={ab,pl,half,v:m[ab]+(pl?P*pl:half),alt:cand.length>1}});
 d.pass={Perception:10+d.skills.Perception.v,Investigation:10+d.skills.Investigation.v,Insight:10+d.skills.Insight.v};
 d.feats=cls?cls.f.filter(f=>f[0]<=lvl):[];
 d.inspDie=(C.cls==='diplomat'||advOf('Diplomat'))?(lvl>=5?'1d8':'1d6'):null;
 d.hasEureka=C.cls==='scientist'||advOf('Scientist');
 d.eurekaMax=d.hasEureka?Math.max(0,Math.max(m.int,m.wis)):0;
 d.res=computeRes(d);
 // defences (auto + custom)
 const df=[];d.origins.forEach(o=>{if(o.res)df.push(o.res+' ('+o.n+')')});
 if(C.cls==='scout')df.push('Environmental damage incl. traps (Survivalist)');
 if(C.cls==='engineer'&&lvl>=2)df.push('Attacks hindered by your cover (Hold Together)');
 if(d.origins.some(o=>o.n==='Aviator'))df.push('Crash damage (Crash Landing)');
 d.immune=C.cls==='scientist'&&lvl>=2?['Charmed (Great Mind)']:[];d.defAuto=df;
 // MP
 d.featMP=C.feats.reduce((s,f)=>s+(+f.mp||0),0);const E=+C.mp.earned||0;
 d.mpLevel=E<20?Math.min(5,Math.floor(E/5)+1):5+Math.floor(d.featMP/10);d.mpAvail=E<20?0:E-20-d.featMP;
 return d}

function computeRes(d){const L=d.lvl,P=d.prof,m=d.m,r=[];
 const add=(key,name,max,reset,src,desc)=>r.push({key,name,max:Math.max(0,max),reset,src,desc});
 const cf=n=>{for(const k of [C.cls,...Object.keys(CLASSES)]){const f=(CLASSES[k]?.f||[]).find(x=>x[1]===n);if(f)return f[3]}return ''};
 if(C.cls==='diplomat'||advOf('Diplomat'))add('inspire','Inspire ('+d.inspDie+')',1,'long',C.cls==='diplomat'?'Class':'Feat',cf('Inspire'));
if(C.cls==='diplomat'&&L>=2)add('peptalk','Pep Talk',1,'mission','Class',cf('Pep Talk'));
 if(C.cls==='diplomat'&&L>=2)add('wiae','Word In An Ear',1,'long','Class',cf('Word In An Ear'));
 if(C.cls==='scientist'&&L>=2)add('apt','Apt Analogy',1,'short','Class',cf('Apt Analogy'));
 if(C.cls==='scout'&&L>=2)add('traps','Trap Parts',P,'long','Class',cf('Trap Rigging'));
if(C.cls==='soldier'||advOf('Soldier'))add('tflex','Tactical Flexibility',1,'long',C.cls==='soldier'?'Class':'Feat',cf('Tactical Flexibility'));
 if(C.cls==='soldier'&&L>=2){add('surge','Surge',1,'either','Class',cf('Surge'));add('rally','Rally',1,'long','Class',cf('Rally'))}
 const rt=n=>(d.race?.tr.find(t=>t[0]===n)||[])[1]||'';
 if(C.race==='aturen_pacifist')add('invis','Invisibility',P,'long','Race',rt('Invisibility'));
 if(C.race==='jaffa')add('symb','Symbiote',Math.max(1,P),'long','Race',rt('Symbiote'));
 if(C.race==='tokra')add('ssymb','Synergistic Symbiote',Math.max(1,m.wis),'long','Race',rt('Synergistic Symbiote'));
 if(C.race==='unas'||C.race==='unas_unchained')add('imres','Impressive Resilience',1,'long','Race',rt('Impressive Resilience'));
 d.origins.forEach(o=>{if(o.use)add('o_'+o.n,o.use.n,o.use.max,o.use.r,'Origin',o.t)});
  C.feats.forEach(f=>{const u=featUse(f);if(u&&!r.some(x=>x.name===f.name))add('f_'+f.id,f.name,(rkm('F',f.name)||{}).u==='P'?P:1,u,'Feat',f.desc||'')});
 C.customRes.forEach(x=>add('c_'+x.id,x.name,+x.max||1,x.reset,'Custom',x.desc||''));
 r.forEach(x=>x.used=clamp(+C.res[x.key]||0,0,x.max));return r}

// ---------- dice ----------
function die(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n+1}
function rollExpr(expr,crit){let total=0;const parts=[];
 const toks=String(expr).replace(/\s+/g,'').replace(/^\+/,'').match(/[+-]?[^+-]+/g)||[];
 toks.forEach(tok=>{const sign=tok[0]==='-'?-1:1;const t=tok.replace(/^[+-]/,'');let m;
  if(/^td$/i.test(t)){const s=+C.tension.slice(1);const n=crit?2:1;const rs=[...Array(n)].map(()=>die(s));const v=rs.reduce((a,b)=>a+b,0);total+=sign*v;parts.push((sign<0?'- ':'+ ')+'TD '+n+'d'+s+' ('+rs.join(', ')+')')}
  else if((m=t.match(/^(\d*)d(\d+)$/i))){const n=(+m[1]||1)*(crit?2:1),s=+m[2];const rs=[...Array(n)].map(()=>die(s));const v=rs.reduce((a,b)=>a+b,0);total+=sign*v;parts.push((sign<0?'- ':'+ ')+n+'d'+s+' ('+rs.join(', ')+')')}
  else if(!isNaN(+t)){total+=sign*(+t);if(+t)parts.push((sign<0?'- ':'+ ')+t)}});
 return{total:Math.max(0,total),text:parts.join(' ').replace(/^\+ /,'')}}

function autoAdv(kind,ab){const a=[],dz=[];const c=C.conds,x=C.exh;
 if(kind==='check'){if(x>=1)dz.push('Exhaustion');if(c.includes('Poisoned'))dz.push('Poisoned');if(c.includes('Frightened'))dz.push('Frightened')}
 if(kind==='attack'){if(x>=3)dz.push('Exhaustion');['Poisoned','Frightened','Prone','Restrained','Grappled'].forEach(k=>{if(c.includes(k))dz.push(k)});if(c.includes('Invisible'))a.push('Invisible');if(C.race==='aturen_pacifist')dz.push('Pacifist');if(D.strShort)dz.push('Armour too heavy');if(D.armorProfMissing)dz.push('Armour proficiency')}
 if(kind==='save'){if(x>=3)dz.push('Exhaustion');if(ab==='dex'&&(c.includes('Restrained')||c.includes('Entangled')))dz.push(c.includes('Restrained')?'Restrained':'Entangled');if(c.includes('Distracted')&&['str','dex','con'].includes(ab))dz.push('Distracted')}
 if(kind==='check'&&D.strShort&&(ab==='str'||ab==='dex'))dz.push('Armour too heavy');
 if(kind==='check'&&D.armorProfMissing&&(ab==='str'||ab==='dex'))dz.push('Armour proficiency');
 if(kind==='check'&&ab==='stealth'&&D.stealthDis)dz.push('Armour');
 return{a,dz}}

function rollD20(title,kind,bonus,opt={}){const au=autoAdv(kind,opt.ab);let adv=UI.rollMode==='adv'||au.a.length>0,dis=UI.rollMode==='dis'||au.dz.length>0;
 let cancel=false;if(adv&&dis){adv=dis=false;cancel=true}const r1=die(20),r2=die(20);const nat=adv?Math.max(r1,r2):dis?Math.min(r1,r2):r1;const total=nat+bonus;
 const how=adv?'Advantage':dis?'Disadvantage':'';const why=[...au.a,...au.dz];
 let brk=(adv||dis?'2d20 ('+r1+', '+r2+')':'1d20 ('+r1+')')+(bonus?' '+(bonus<0?'- ':'+ ')+Math.abs(bonus):'');
 if(how)brk+=' • '+how+(why.length?' ('+why.join(', ')+')':'');else if(cancel)brk+=' • Advantage and disadvantage cancel out'+(why.length?' ('+why.join(', ')+')':'');
 const crit=kind==='attack'&&nat>=(opt.critOn||20),fum=nat===1&&kind!=='plain';
 logRoll(title,kind==='plain'?'':kind,total,brk,crit?'crit':fum?'fumble':'');
 if(UI.rollMode!=='normal'){UI.rollMode='normal';renderRollMode()}return{nat,total,crit}}
function rollDamage(title,expr,crit){const r=rollExpr(expr,crit);logRoll(title,crit?'damage (crit)':'damage',r.total,r.text,crit?'crit':'');return r}
function logRoll(title,kind,total,brk,cls){UI.log.unshift({time:Date.now(),title,kind,total,brk,cls});UI.log=UI.log.slice(0,150);
 toast(title+(kind?' '+kind:'')+': '+total);if(UI.panel.k==='log')renderSide()}
function logInfo(title,text){UI.log.unshift({time:Date.now(),title,kind:'',total:'',brk:text,cls:'info'});if(UI.panel.k==='log')renderSide()}
let toastT;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200)}

function renderTabs(){$('tabnav').innerHTML=TABS.map(([k,l])=>`<button class="${UI.tab===k?'on':''}" ${on('setTab',k)}>${esc(l)}</button>`).join('');
 const f={weapons:tabWeapons,actions:tabActions,fa:tabFA,inventory:tabInventory,background:tabBackground,notes:tabNotes,extras:tabExtras}[UI.tab];$('tabbody').innerHTML=f()}
function filters(list,cur,fn){return`<div class="filters">${list.map(([k,l])=>`<button class="${cur===k?'on':''}" ${on(fn,k)}>${l}</button>`).join('')}</div>`}
function setFilter(k){UI.filter=k;renderTabs()}
// ---------- Free level feats: Attack Specialist (5), Veteran (11), Ace (17) ----------
function atkSel(lv){return C['atk'+lv]||(lv===5?C.atkGrp||'':'')}
function setAtkSel(lv,v){C['atk'+lv]=v;if(lv===5)C.atkGrp=v;commit()}
function atkMult(pc){if(!pc)return 1;if(D.lvl>=17&&atkSel(17)===pc)return 4;if(D.lvl>=11&&atkSel(11)===pc)return 3;if(D.lvl>=5&&atkSel(5)===pc)return 2;return 1}
function atkBody(lv){const sel=atkSel(lv),taken=[5,11,17].filter(x=>x!==lv).map(atkSel).filter(Boolean);
 const opts=Object.entries(WEAPON_GROUPS).filter(([k])=>C.profs.weapons[k]&&(!taken.includes(k)||k===sel));
 return`<div style="margin-top:6px"><select onclick="event.stopPropagation()" onchange="setAtkSel(${lv},this.value)"><option value="">Choose a weapon type</option>${opts.map(([k,l])=>`<option value="${k}" ${sel===k?'selected':''}>${l}</option>`).join('')}</select>${opts.length?'':'<div class="lsrc">Tick a weapon proficiency in Manage first.</div>'}</div>`}

const ATK_FREE=[[5,'Attack Specialist','twice'],[11,'Attack Veteran','three times'],[17,'Attack Ace','four times']];
function atkFeatsHtml(){if(D.lvl<5)return'';
 const g=C.atkGrp||'',gl=WEAPON_GROUPS[g]||'',opts=Object.entries(WEAPON_GROUPS).filter(([k])=>C.profs.weapons[k]);
 let h=`<div class="feat"><div class="fn">Attack training</div><div class="fs">Free bonus feats at levels 5, 11 and 17</div><div class="fd"><select onchange="setAtkGrp(this.value)"><option value="">Choose a weapon proficiency</option>${opts.map(([k,l])=>`<option value="${k}" ${g===k?'selected':''}>${l}</option>`).join('')}</select>${opts.length?'':'<br>Tick a weapon proficiency in Manage first.'}</div></div>`;
 ATK_FREE.forEach(([lv,n,w])=>{if(D.lvl>=lv)h+=`<div class="feat"><div class="fn">${n}${gl?': '+gl:''}</div><div class="fs">Level ${lv} bonus feat \u2022 free</div><div class="fd">${gl?`You roll ${w} as many weapon damage dice with ${gl}. Static modifiers and bonus dice from other sources are not multiplied.`:'Choose a weapon proficiency above.'}</div></div>`});
 return h}
function setAtkGrp(v){C.atkGrp=v;commit()}
// ---------- Weapon Specialization feat: +1 to hit and damage per rank, chosen by weapon type ----------
function wsPts(){return C.feats.filter(f=>f.name==='Weapon Specialization').length}
function wsCap(){return D.lvl>=17?5:D.lvl>=14?4:D.lvl>=11?3:D.lvl>=8?2:1}
function wsRank(pc){return clamp((C.wspec||{})[pc]||0,0,wsCap())}
function wsUsed(){return Object.keys(C.wspec||{}).reduce((a,k)=>a+wsRank(k),0)}
function wsAdj(pc,d){C.wspec=C.wspec||{};const r=wsRank(pc);
 if(d>0&&(r>=wsCap()||wsUsed()>=wsPts()))return toast(r>=wsCap()?'That weapon type is at its maximum for your level.':'No Weapon Specialization picks left. Buy the feat in the Feats tab.');
 C.wspec[pc]=clamp(r+d,0,5);if(!C.wspec[pc])delete C.wspec[pc];commit()}
function wsChip(pc){if(!wsPts())return'';const r=wsRank(pc);
 return`<div class="sub2">Specialised <button class="rbtn" style="padding:0 6px" ${onS('wsAdj',pc,-1)} aria-label="Less specialisation">\u2212</button> <b>${r?'+'+r:'none'}</b> <button class="rbtn" style="padding:0 6px" ${onS('wsAdj',pc,1)} aria-label="More specialisation">+</button></div>`}

// weapon maths
function modeStats(it,mi){const md=it.w.modes[mi];const[mn,kind,dmg,dt,rng,fin]=md;const m=D.m;
 let ab=kind==='melee'?'str':'dex';if(fin||/throw/i.test(mn)||(C.origins.includes("Student of Bra'tac")&&/ma'tok/i.test(it.n)))ab=m.str>=m.dex?'str':'dex';
 const prof=it.prof==='auto'?weaponProf(it.w.pc):it.prof==='yes';const fac=C.facility||{},fr=+fac.rating||0;
 let hit=wsRank(it.w.pc)+m[ab]+(prof?D.prof:(C.race==='jaffa_free'?Math.floor(D.prof/2):0))+(kind==='ranged'&&fac.name==='Firing Range'?fr:0);
 let dm=String(dmg);if(C.cls==='soldier'&&D.lvl>=3&&kind==='melee')dm=dm.replace(/^(\d*)d(4|6)\b/,'$1d8');
 const am=atkMult(it.w.pc);if(am>1)dm=dm.replace(/^(\d*)d(\d+)/,(x,n,z)=>((+n||1)*am)+'d'+z);
 let bonus=wsRank(it.w.pc)+m[ab]+(kind==='ranged'&&fac.name==='Armory'?fr:0)+(kind==='melee'&&fac.name==='Gym'?fr:0);
 const dmgExpr=dm==='0'?'0':dm+(bonus?(bonus>0?'+':'')+bonus:'');
 const critOn=(C.cls==='soldier'&&D.lvl>=3&&(C.impCrit||'')===it.w.pc)?19:20;
 return{mn,kind,dt,rng,ab,prof,hit,dmgExpr,critOn}}
function unarmed(){const ma=C.profs.weapons.martial;let die=ma?(C.cls==='soldier'&&D.lvl>=3?'1d8':'1d6'):'';if(die)die=die.replace(/^(\d*)d(\d+)/,(x,n,z)=>((+n||1)*atkMult('martial'))+'d'+z);const s=D.m.str;
 const rows=[{n:ma?'Martial Arts':'Unarmed Strike',sub:'Melee • Bludgeoning',hit:s+D.prof+(ma?wsRank('martial'):0),dmg:ma?die+((s+wsRank('martial'))?(s+wsRank('martial')>0?'+':'')+(s+wsRank('martial')):''):String(Math.max(0,1+s)),rng:'1m',pc:ma?'martial':''}];
 if(C.race==='unas'||C.race==='unas_unchained')rows.push({n:'Claws',sub:'Melee • Natural weapon',hit:s+D.prof,dmg:'1d6'+(s?(s>0?'+':'')+s:''),rng:'1m'});return rows}

function tabWeapons(){let h='';const eqw=C.inv.filter(i=>i.w&&i.eq);
 h+=`<div class="sec"><span>Attacks</span><button class="btn sm" ${on('setTab','inventory')}>Manage weapons</button></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Attack</th><th>Range</th><th>Hit</th><th>Damage</th><th class="hidem">Notes</th></tr></thead><tbody>`;
 eqw.forEach(it=>it.w.modes.forEach((md,mi)=>{const s=modeStats(it,mi);const bw=it.w.pc==='bows';
  h+=`<tr class="clkrow" ${on('openPanel','item',it.id)}><td><b>${esc(it.n)}</b><div class="sub2">${esc(md[0])} • ${s.kind==='melee'?'Melee':'Ranged'}${s.prof?'':' • not proficient'}</div>${wsChip(it.w.pc)}</td>
   <td class="mono" style="font-size:12px">${esc(s.rng||'1m')}</td>
   <td><button class="rbtn" ${onS('rollAttack',it.id,mi)}>${sgn(s.hit)}</button></td>
   <td>${s.dmgExpr==='0'?'<span class="muted">Special</span>':`<button class="rbtn" ${onS('rollWeaponDmg',it.id,mi,false)}>${esc(s.dmgExpr)}</button>`}<div class="sub2">${esc(s.dt)}</div></td>
   <td class="hidem" style="font-size:12px;color:var(--text2);max-width:220px">${it.w.cap?`<span class="mono" style="white-space:nowrap">Ammo <button class="rbtn" style="padding:0 6px" ${onS('ammo',it.id,-1)}>−</button> ${it.ammo??it.w.cap}${bw?'':'/'+it.w.cap} <button class="rbtn" style="padding:0 6px" ${onS('ammo',it.id,1)}>+</button> <button class="rbtn" style="padding:0 6px" ${onS('ammo',it.id,0)} title="Reload">↻</button></span><br>`:''}${esc(short(it.w.sp))}</td></tr>`}));
 unarmed().forEach(u=>{h+=`<tr class="clkrow" ${on('openPanel','action','Unarmed')}><td><b>${u.n}</b><div class="sub2">${u.sub}</div>${u.pc?wsChip(u.pc):''}</td><td class="mono" style="font-size:12px">${u.rng}</td>
  <td><button class="rbtn" ${onS('rollUnarmedHit',u.n,u.hit)}>${sgn(u.hit)}</button></td><td><button class="rbtn" ${onS('rollUnarmedDmg',u.n,u.dmg)}>${esc(u.dmg)}</button></td><td class="muted hidem" style="font-size:12px">Always proficient</td></tr>`});
h+=`</tbody></table></div>`;if(wsPts())h+=`<p class="lhint">Weapon Specialization: ${wsUsed()} of ${wsPts()} picks used. Each rank adds +1 to hit and damage for that weapon type (maximum +${wsCap()} at your level).</p>`;if(!eqw.length)h+=`<div class="empty">No weapons equipped. Tick the box beside a weapon in Inventory to show it here.</div>`;
 h+=`<div class="sec">Actions in combat</div><div class="plist">${ACTIONS.filter(a=>a.g==='action').map(a=>`<a ${on('openPanel','action',a.n)}>${a.n}</a>`).join(', ')}</div>
  <div class="sec">Combat contests</div><div class="plist">${ACTIONS.filter(a=>a.g==='contest').map(a=>`<a ${on('openPanel','action',a.n)}>${a.n}</a>`).join(', ')}</div>
  <div class="sec">Reactions</div><div class="plist"><a ${on('openPanel','action','Opportunity Attack')}>Opportunity Attack</a></div>`;
 return h}

function short(t){t=String(t||'').split(/[.(]/)[0].trim();return t.length>48?t.slice(0,46)+'...':t}
function featRow(f){const i=D.cls.f.indexOf(f);return`<div class="feat" ${on('openPanel','feature',i)}><div class="fn">${esc(f[1])}</div><div class="fs">${D.cls.n} ${f[0]} • ${{action:'Action',bonus:'Bonus action',reaction:'Reaction',other:'Feature'}[f[2]]}</div><div class="fd">${esc(f[3])}</div></div>`}
function purchFeatRow(f){return`<div class="feat" ${on('openPanel','feat',f.id)}><div class="fn">${esc(f.name)}</div><div class="fs">Feat • ${esc(f.cat)}</div><div class="fd">${esc(f.desc||'')}</div></div>`}
function traitRow(n){const i=D.race.tr.findIndex(t=>t[0]===n);if(i<0)return'';return`<div class="feat" ${on('openPanel','trait',i)}><div class="fn">${esc(n)}</div><div class="fs">${esc(D.race.n)} trait</div><div class="fd">${esc(D.race.tr[i][1])}</div></div>`}
const RESET_L={short:'Short rest',long:'Long rest',either:'Short or long rest',enc:'Per encounter',mission:'Per mission',none:'Manual'};
function resRow(r){return`<div class="res"><div class="rn" ${on('openPanel','res',r.key)}><b>${esc(r.name)}</b><small>${r.src} • ${RESET_L[r.reset]} • ${r.max-r.used} of ${r.max} left</small></div>
 <div class="boxes">${[...Array(r.max)].map((_,i)=>`<button class="ubox ${i<r.used?'used':''}" ${on('toggleUse',r.key,i)} aria-label="Use ${esc(r.name)}"></button>`).join('')}</div></div>`}

const TYPE_L={action:'Main action',bonus:'Bonus action',reaction:'Reaction',pass:'Always on'};
const ADV_ABIL={Diplomat:'Inspire',Engineer:'Jury Rig',Medic:'First Aid',Scientist:'Eureka',Scout:'Survivalist',Soldier:'Tactical Flexibility'};
const RK_CLASS={'Inspire':'inspire','Pep Talk':'peptalk','Apt Analogy':'apt','Trap Rigging':'traps','Word In An Ear':'wiae','Tactical Flexibility':'tflex','Surge':'surge','Rally':'rally'};
const RK_RACE={'Invisibility':'invis','Symbiote':'symb','Synergistic Symbiote':'ssymb','Impressive Resilience':'imres'};
function advOf(k){return C.feats.some(f=>f.name==='Advanced Training: '+k)}
function typeFromText(t){t=String(t||'');return /as an action/i.test(t)?'action':/bonus action/i.test(t)?'bonus':/(use your reaction|as a reaction)/i.test(t)?'reaction':'pass'}
function featUse(f){const km=rkm('F',f.name);if(km)return km.u&&km.r?km.r:null;const m=String(f.desc||'').match(/once per (short rest|long rest|mission|day|infiltration encounter|diplomatic function)/i);if(!m)return null;const k=m[1].toLowerCase();return k==='short rest'?'short':(k==='long rest'||k==='day')?'long':'mission'}
function abilityList(){const L=[],seen={};
 const add=e=>{const k=e.n.toLowerCase();if(seen[k])return;seen[k]=1;L.push(e)};
 if(D.cls)D.cls.f.forEach((f,i)=>{if(f[1]==='Ability Score Improvement'||mw('C',f[1])==='na'||(f[1]==='Eureka'&&D.hasEureka))return;add({n:f[1],src:D.cls.n+' '+f[0],type:mt('C',f[1],f[2]==='other'?'pass':f[2]),d:f[3],locked:f[0]>D.lvl,lvl:f[0],rk:RK_CLASS[f[1]],pk:'feature',pa:i,die:/^(Inspire|Word In An Ear)$/.test(f[1])&&D.inspDie})});
 Object.entries(ADV_ABIL).forEach(([k,ab])=>{if(!advOf(k)||C.cls===k.toLowerCase()||ab==='Eureka')return;const f=CLASSES[k.toLowerCase()].f.find(x=>x[1]===ab);const ft=C.feats.find(x=>x.name==='Advanced Training: '+k);if(!f)return;add({n:ab,src:'Feat',type:mt('C',ab,f[2]==='other'?'pass':f[2]),d:f[3],rk:RK_CLASS[ab],pk:'feat',pa:ft.id,die:ab==='Inspire'&&D.inspDie})});
 if(D.race)D.race.tr.forEach((t,i)=>{if(t[0]==='Claws'||mw('R',t[0])==='na')return;add({n:t[0],src:D.race.n,type:mt('R',t[0],typeFromText(t[1])),d:t[1],rk:RK_RACE[t[0]],pk:'trait',pa:i})});
 D.origins.forEach(o=>mw('O',o.ab)==='na'||add({n:o.ab,src:o.n+' origin',type:mt('O',o.ab,typeFromText(o.t)),d:o.t,rk:o.use?'o_'+o.n:undefined,pk:'origin',pa:o.n}));
 C.feats.forEach(f=>{if(/^Advanced Training/.test(f.name))return;const t=mt('F',f.name,'');if(['class','action','bonus','reaction','rest'].includes(t))add({n:f.name,src:'Feat \u2022 '+f.cat,type:t,d:f.desc||'',rk:'f_'+f.id,pk:'feat',pa:f.id})});
 return L}

function noteMove(d){const a=C.notes.tabs,c=noteCur(),i=a.indexOf(c),j=i+d;if(j<0||j>=a.length)return;a.splice(i,1);a.splice(j,0,c);scheduleSave();renderTabs()}
function noteDelete(){const a=C.notes.tabs,c=noteCur();if(a.length<2)return toast('You need at least one tab');
 if(c.b.trim()&&!confirm('Delete "'+c.t+'" and everything in it?'))return;const i=a.indexOf(c);a.splice(i,1);UI.noteTab=a[Math.max(0,i-1)].id;UI.noteMenu=false;scheduleSave();renderTabs()}

function tabExtras(){const E=+C.mp.earned||0;const fac=C.facility;
 let h=`<div class="sec">Mission points</div><div class="fgrid"><div><div class="lbl">MP earned (total)</div><input type="number" min="0" value="${E}" onchange="setNum('mp.earned',this.value)"></div>
  <div><div class="lbl">MP spent on feats</div><input disabled value="${D.featMP}"></div></div>
  <div class="kv"><span>${E<20?'Levels 1 to 5: every 5 MP earned is a level':'Specialist: every 10 MP spent on feats is a level'}</span><b>Level ${D.mpLevel}</b></div>
  ${E>=20?`<div class="kv"><span>MP available to spend</span><b>${D.mpAvail}</b></div>`:''}
  ${E>0&&D.mpLevel!==D.lvl?`<div class="panel-actions"><button class="btn" ${on('setLevel',D.mpLevel)}>Set level to ${D.mpLevel}</button></div>`:''}`;
 h+=`<div class="sec">Theme</div><select onchange="setTheme(this.value)">${Object.keys(THEMES).map(k=>`<option value="${k}" ${C.theme===k?'selected':''}>${k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).replace('Sgc','SGC').replace('Goauld',"Goa'uld").replace('Tokra',"Tok'ra").replace('Kethalis',"Keth'alis")}</option>`).join('')}</select>`;
 h+=`<div class="sec">Backup</div><div class="panel-actions" style="margin-top:0"><button class="btn" onclick="exportData()">Download backup (.json)</button><button class="btn" onclick="$('impF').click()">Restore from backup</button><input type="file" id="impF" accept=".json" class="hidden" onchange="importData(event)"></div>`;
 return h}

function isWide(){return window.innerWidth>=1280}
function openPanel(k,a){if(UI.view&&UI.view!=='sheet')setView('sheet');UI.panel={k,a};UI.open=true;applySide();renderSide();if(!isWide()||!UI.pinned)$('side-body').scrollTop=0}
function closeSide(){UI.open=false;applySide()}
function togglePin(){UI.pinned=!UI.pinned;try{localStorage.setItem('sgc-pinned',UI.pinned?'1':'0')}catch(e){}applySide()}
function applySide(){const s=$('side'),over=!isWide()||!UI.pinned;
 s.classList.toggle('overlay',over);s.classList.toggle('open',over&&UI.open);s.classList.toggle('hidden',!over&&!UI.open);
 $('scrim').classList.toggle('hidden',!(over&&UI.open));$('fab').classList.toggle('hidden',UI.open);
 const pb=$('pinbtn');pb.classList.toggle('hidden',!isWide());pb.textContent=UI.pinned?'Unpin':'Pin';pb.title=UI.pinned?'Let the panel slide over the sheet':'Keep the panel fixed beside the sheet'}
window.addEventListener('resize',()=>{clearTimeout(window._rs);window._rs=setTimeout(applySide,120)});

const PANEL_T={log:'Game log',ability:'Ability',save:'Saving throw',saveinfo:'Saving throws',skill:'Skill',skillinfo:'Skills',hp:'HP management',tension:'Tension die',dp:'Determination',prof:'Proficiency bonus',speed:'Speed',ac:'Armour class',init:'Initiative',moxie:'Moxie',senses:'Senses',defenses:'Defences',conditions:'Conditions',shortrest:'Short rest',longrest:'Long rest',manage:'Manage character',item:'Item',additem:'Add items',action:'Action',feature:'Class feature',trait:'Racial trait',origin:'Origin',feat:'Feat',addfeat:'Add feat',res:'Limited use',addres:'Add tracker',profs:'Proficiencies',newmission:'Mission completed',settings:'Settings',appearance:'Appearance'};
function renderSide(){const {k,a}=UI.panel;$('side-t').textContent=PANEL_T[k]||'';const f=PANELS[k]||PANELS.log;$('side-body').innerHTML=f(a)}
const btn=(label,fn,args=[],cls='btn')=>`<button class="${cls}" ${on(fn,...args)}>${label}</button>`;
const rollBtn=(label,fn,...args)=>`<button class="btn pri" ${on(fn,...args)}>${label}</button>`;
function custBlock(key,inner){const open=!!(UI.custOpen&&UI.custOpen[key]);
 return`<div class="custwrap"><button class="custtoggle" ${on('toggleCustom',key)}>${open?'︿':'⌄'} Customize</button>${open?`<div class="custbody">${inner}</div>`:''}</div>`}
function ago(t){const s=Math.round((Date.now()-t)/1000);return s<60?'just now':s<3600?Math.round(s/60)+' min ago':Math.round(s/3600)+' h ago'}

const PANELS={
settings(){return`<h2>Settings</h2>
 ${isGM?`<div class="res"><div class="rn" ${on('showPicker')}><b>Characters</b><small>See or switch to any player's sheet</small></div></div>`:''}
 ${isGM&&viewOwner?`<h3>Wrist device for this character</h3>${deviceRow('addresses','Addresses tab','Portal addresses their wrist device can dial (on by default)')}${deviceRow('archive','Archive tab',"Shows the Rala'Kethara archive inside their sheet")}${deviceRow('shield',"Oma'thala tab",'Furling armshield: three symbol buttons')}${deviceRow('images','Images tab','Their own photos, plus anything you share with them')}<h3>Sheet</h3>`:''}
 <div class="res"><div class="rn" ${on('openPanel','appearance')}><b>Change sheet appearance</b><small>Colour theme, background, night mode</small></div></div>
 <div class="res"><div class="rn" ${on('openPanel','profs')}><b>Proficiencies &amp; training</b><small>Armour, weapons, tools, languages</small></div></div>
 <div class="res"><div class="rn" ${on('setTab','extras')}><b>Backup &amp; mission points</b><small>Mission points, theme, download or restore a backup</small></div></div>`},

appearance(){const bg=C.bgImage;
 return`<h2>Appearance</h2>
 <h3>Colour theme</h3><div class="swrow">${Object.keys(THEMES).map(k=>`<button class="sw ${C.theme===k?'on':''}" style="background:${THEMES[k].sw||THEMES[k].acc||THEMES[k].acc2}" title="${themeLabel(k)}" ${on('setTheme',k)}></button>`).join('')}</div>
 <div class="muted" style="font-size:12px;margin-top:2px">${themeLabel(C.theme)}</div>
   <h3>Font</h3><div class="frow" style="flex-wrap:wrap;gap:6px">${[['default','Theme default',''],['fira','Fira Sans',"'Fira Sans',sans-serif"],['dm','DM Sans',"'DM Sans',sans-serif"],['system','System',"system-ui,sans-serif"],['arial','Arial',"Arial,Helvetica,sans-serif"],['verdana','Verdana',"Verdana,'DejaVu Sans',sans-serif"],['bitter','Bitter',"'Bitter',serif"],['georgia','Georgia',"Georgia,serif"]].map(([k,l,f])=>`<button class="btn sm ${(C.font||'default')===k?'on':''}" style="${f?'font-family:'+f+';':''}font-size:13px;text-transform:none;letter-spacing:0" ${on('setFont',k)}>${l}</button>`).join('')}</div>
 <h3>Box corners</h3><div class="frow" style="flex-wrap:wrap;gap:6px">${[['default','Theme default'],['curved','Curved'],['straight','Straight']].map(([k,l])=>`<button class="btn sm ${(C.corners||'default')===k?'on':''}" ${on('setCorners',k)}>${l}</button>`).join('')}</div>
 <h3>Background</h3>
 <div class="frow"><button class="btn sm ${!bg?'on':''}" ${on('clearBg')}>Solid colour</button><button class="btn sm" onclick="$('bgUp').click()">Upload image</button><input type="file" id="bgUp" class="hidden" accept="image/*" onchange="loadBgImage(event)"></div>
 ${bg?`<div class="kv"><span>Custom background set</span><button class="btn sm" ${on('clearBg')}>Remove</button></div>`:'<p class="rule">Panels use frosted glass over any background, so text stays sharp either way.</p>'}
 <h3>Night mode</h3><label class="frow"><input type="checkbox" ${C.nightMode?'checked':''} ${on('toggleNight')}> Dim the whole sheet slightly, easier on the eyes for late sessions</label>`},

log(){if(!UI.log.length)return`<h2>Game log</h2><p class="rule">Click any modifier, save, skill, attack or damage value on the sheet to roll it. Results appear here. Use the Adv / Dis buttons at the top to roll your next d20 with advantage or disadvantage.</p><p class="rule">The log is kept on this device for this session.</p>`;
 return`<div class="panel-actions" style="margin-top:0">${btn('Clear log','clearLog',[],'btn sm')}</div>`+UI.log.map(e=>`<div class="logentry"><div class="who">${esc(C.name||'You')} • ${ago(e.time)}</div>
  <div class="logcard ${e.cls}"><div class="lt">${esc(e.title)}${e.kind?`: <em>${esc(e.kind)}</em>`:''}<span class="brk">${esc(e.brk)}</span></div>${e.total!==''?`<div class="tot">${e.total}</div>`:''}</div></div>`).join('')},

ability(k){const a=ABILS.find(x=>x.k===k);return`<h2>${a.n}</h2>
 <div class="kv"><span>Score</span><b>${C.scores[k]}</b></div>
 <div class="kv"><span>Modifier</span><b>${sgn(D.m[k])}</b></div>
 <div class="kv"><span>${a.n} save</span><b>${sgn(D.saves[k])}${C.saveProf[k]?' • proficient':''}</b></div>
 <p style="margin-top:12px">${esc(a.d)}</p>
 ${custBlock('ability-'+k,`<div class="ctr" style="margin-bottom:8px"><button ${on('adjScore',k,-1)}>−</button><input type="number" style="width:80px;text-align:center" value="${C.scores[k]}" onchange="setScore('${k}',this.value)"><button ${on('adjScore',k,1)}>+</button></div>
 <p class="rule">Enter your final score, including racial and origin bonuses. Modifier = (score − 10) ÷ 2, rounded down. Player characters can't exceed 20.</p>
 <label class="frow"><input type="checkbox" ${C.saveProf[k]?'checked':''} ${on('toggleSaveProf',k)}> Proficient in ${a.n} saves</label>`)}`},

saveinfo(){return`<h2>Saving throws</h2><p>A save resists harm such as a blast, poison or Goa'uld mind control. Roll d20 + the ability modifier, plus your proficiency bonus if proficient.</p>
 ${ABILS.map(a=>`<div class="kv"><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" ${C.saveProf[a.k]?'checked':''} ${on('toggleSaveProf',a.k)}> ${a.n}</label><b class="clk" ${on('rollSave',a.k)}>${sgn(D.saves[a.k])}</b></div>`).join('')}
 <p class="rule" style="margin-top:10px">Class saves: Diplomat WIS/CHA, Engineer DEX/INT, Medic DEX/WIS, Scientist INT/WIS, Scout CON/DEX, Soldier STR/CON.${C.facility.name==='Mess Hall'?' Mess Hall bonus included in CON and WIS.':''}</p>`},

skill(n){const s=SKILLS.find(x=>x.n===n),k=D.skills[n];return`<h2>${n}</h2><p class="rule">${ABN(k.ab)}</p><p>${esc(s.d)}</p>
 ${custBlock('skill-'+n,`<div class="kv"><span>${ABN(k.ab)} modifier</span><b>${sgn(D.m[k.ab])}</b></div>
 <div class="kv"><span>${k.pl===2?'Expertise (double proficiency)':k.pl?'Proficiency':k.half?'Cross-Discipline Studies (half)':'Not proficient'}</span><b>${sgn(k.pl?D.prof*k.pl:k.half)}</b></div><div class="kv"><span>Total</span><b>${sgn(k.v)}</b></div>
 <h3>Proficiency</h3><div class="seg">${[[0,'None'],[1,'Proficient'],[2,'Expertise']].map(([v,l])=>`<button class="${k.pl===v?'on':''}" ${on('setSkillProf',n,v)}>${l}</button>`).join('')}</div>
 <h3>Ability used</h3><select onchange="setSkillAbil('${n}',this.value)"><option value="">Automatic (${AB(k.ab)})</option>${ABILS.map(a=>`<option value="${a.k}" ${C.skillAbil[n]===a.k?'selected':''}>${a.n}</option>`).join('')}</select>
 <p class="rule" style="margin-top:6px">Some origins and abilities let you use a different ability for this skill. Automatic picks the best one you're allowed.</p>`)}`},
skillinfo(){return`<h2>Skills</h2><p>Click a skill's bonus to roll it, or its name for details. Click the dot to cycle between not proficient, proficient (adds ${sgn(D.prof)}) and expertise (adds ${sgn(D.prof*2)}).</p><p class="rule">A dashed dot means Cross-Discipline Studies is adding half your proficiency bonus.</p>`},

prof(){return`<h2>Proficiency bonus: ${sgn(D.prof)}</h2><p>Added to any d20 roll using a skill, save, tool or weapon you're proficient with. It never applies more than once to the same roll.</p><h3>By level</h3>${[[1,4,2],[5,8,3],[9,12,4],[13,16,5],[17,20,6]].map(([a,b,p])=>`<div class="kv"><span>Levels ${a} to ${b}</span><b>+${p}</b></div>`).join('')}`},

speed(){return`<h2>Speed: ${D.speed}m</h2><p>How far you can move in one combat round. Everyone starts at 6m.</p>
 <h3>Breakdown</h3><div class="kv"><span>Base</span><b>6m</b></div>${D.origins.filter(o=>o.spd).map(o=>`<div class="kv"><span>${o.n}</span><b>+${o.spd}m</b></div>`).join('')}
 ${D.body&&D.body.a.kind==='heavy'?'<div class="kv"><span>Heavy armour</span><b>−2m</b></div>':''}${D.strShort?'<div class="kv"><span>Armour Strength requirement not met</span><b>1m</b></div>':''}
 ${C.exh>=2?`<div class="kv"><span>Exhaustion ${C.exh}</span><b>${C.exh>=5?'0m':'halved'}</b></div>`:''}
 <h3>Other modifier</h3><input type="number" value="${+C.speedMod||0}" onchange="setNum('speedMod',this.value)">
 <p class="rule" style="margin-top:8px">Low gravity adds 2m. Climbing, crawling or swimming costs double unless you have that speed. Difficult terrain costs double.</p>`},

tension(){return`<h2>Tension die</h2><p>Set by the GM for each episode or scene, using the dropdown at the top of the sheet. Anything marked +TD rolls this die automatically as part of that roll, so you shouldn't need to roll it alone.</p>
 ${Object.entries(TENSION).map(([k,t])=>`<div class="kv" style="align-items:flex-start;${C.tension===k?'':'opacity:.55'}"><span><b style="font-family:var(--mono)">${k}</b> ${t.n}<br><span class="muted" style="font-size:12.5px">${t.t}</span></span><b>DC ${t.dc}</b></div>`).join('')}
 <div class="panel-actions">${btn('Roll '+C.tension+' on its own','rollTD',[],'btn sm')}</div>`},

dp(){return`<h2>Determination: ${D.dp} / ${D.dpBase}</h2><p>Grit and force of will, wagered or spent in Plot encounters (convince, diplomatic function, infiltration and so on). Some feats spend DP in other ways.</p>
 <div class="ctr" style="margin:8px 0 12px"><button ${on('adjDP',-1)}>−</button><span class="mono" style="font-size:22px;min-width:40px;text-align:center">${D.dp}</span><button ${on('adjDP',1)}>+</button>${btn('Reset to base','setDP',[null],'btn sm')}</div>
 <h3>Rules</h3><ul class="rule"><li>Base DP = proficiency bonus (${sgn(D.prof)}) + class bonus (${D.cls?'+'+D.cls.det:'+0'}).</li><li>You can earn DP above your base. You can't go below 0.</li><li>At 0 DP you can't choose to wager, but if forced you wager the minimum.</li><li>DP resets to base at the end of every long rest.</li></ul>`},

init(){return`<h2>Initiative: ${sgn(D.init)}</h2><p>Sets the acting order in Action encounters (combat, chases, traversal). Uses your Dexterity or Wisdom modifier, whichever is higher.</p>
 <label class="frow"><input type="checkbox" ${C.impInit?'checked':''} ${on('toggleFlag','impInit')}> Improved Initiative feat (add proficiency)</label>
 ${D.origins.some(o=>o.n==='Freedom Fighter')?'<p class="rule">Freedom Fighter: advantage on Initiative checks (use Adv).</p>':''}<div class="panel-actions">${rollBtn('Roll initiative','rollInit')}</div>`},
moxie(){return`<h2>Moxie: ${sgn(D.moxie)}</h2><p>Sets the acting order in Plot encounters (social, puzzle and mental challenges). Uses your Intelligence or Charisma modifier, whichever is higher.</p>
 <label class="frow"><input type="checkbox" ${C.impMoxie?'checked':''} ${on('toggleFlag','impMoxie')}> Improved Moxie feat (add proficiency)</label>
 ${D.origins.some(o=>o.n==='Freedom Fighter')?'<p class="rule">Freedom Fighter: disadvantage on Moxie checks (use Dis).</p>':''}<div class="panel-actions">${rollBtn('Roll Moxie','rollMoxie')}</div>`},

senses(){return`<h2>Passive senses</h2><p>Used when the GM checks without asking you to roll: 10 + all modifiers that normally apply. Add 5 with advantage, subtract 5 with disadvantage.</p>
 ${Object.entries(D.pass).map(([k,v])=>`<div class="kv"><span>Passive ${k}</span><b>${v}</b></div>`).join('')}`},

ac(){const b=D.body;return`<h2>Armour class: ${D.ac}</h2><p>How hard you are to hit. An attack that meets or beats your AC hits.</p><h3>Breakdown</h3>
 ${b?`<div class="kv"><span>${esc(b.n)} (${b.a.kind})</span><b>${b.a.ac}</b></div>${b.a.kind==='light'?`<div class="kv"><span>Dexterity</span><b>${sgn(D.m.dex)}</b></div>`:''}`:`<div class="kv"><span>No armour: 10 + Dexterity</span><b>${10+D.m.dex}</b></div>`}
 ${D.addons.map(i=>`<div class="kv"><span>${esc(i.n)}</span><b>+${i.a.ac}</b></div>`).join('')}
 <h3>Other bonus</h3><input type="number" value="${+C.acMod||0}" onchange="setNum('acMod',this.value)"><p class="rule" style="margin-top:6px">For feats like Dodge (+1 in light or no armour) or Defensive Motivation while Inspired.</p>
 ${D.strShort?`<p style="color:var(--red2)">Your Strength is below this armour's requirement (${b.a.str}): disadvantage on attacks and STR/DEX checks, and speed drops to 1m.</p>`:''}
 ${D.armorProfMissing?`<p style="color:var(--red2)">You're not proficient with ${b.a.kind} armour: disadvantage on attacks and on STR/DEX checks and saves. Fix this under Proficiencies.</p>`:''}
 <h3>Cover</h3><ul class="rule"><li>Half cover: +2 AC and DEX saves.</li><li>Three-quarters cover: +5 AC and DEX saves.</li><li>Total cover: can't be targeted directly.</li></ul>
 <div class="panel-actions">${btn('Change armour','setTab',['inventory'])}</div>`},

profs(){const P=C.profs;return`<h2>Proficiencies &amp; training</h2><p class="rule">Filled in from your class when you choose it (Manage character). Tick anything extra from your race, origins or feats.</p>
 <h3>Armour</h3><div class="kitl">${[['light','Light'],['heavy','Heavy']].map(([k,l])=>`<label><input type="checkbox" ${P['armor'+(k==='light'?'Light':'Heavy')]?'checked':''} ${on('toggleArmorProf',k)}> ${l}</label>`).join('')}</div>
 <h3>Weapons</h3><div class="kitl">${Object.entries(WEAPON_GROUPS).map(([k,l])=>`<button class="pcyc" ${on('cycleWeaponProf',k)} title="Tap to change: not proficient, proficient, expertise">${profDots(wpl(k),0)}<span>${l}</span><small>${['','Proficient','Expertise'][wpl(k)]}</small></button>`).join('')}</div>
 <h3>Tools</h3><div class="kitl">${TOOLS.map(t=>`<label><input type="checkbox" ${P.tools.includes(t)?'checked':''} ${on('toggleTool',t)}> ${t}</label>`).join('')}</div>
 <h3>Languages</h3>${['Milky Way','Kigal Galaxy'].map(g=>`<div class="lbl" style="margin:8px 0 4px">${g}</div><div class="kitl">${LANGUAGES.filter(l=>l.g===g).map(l=>`<label><input type="checkbox" ${P.languages.includes(l.n)?'checked':''} ${on('toggleLanguage',l.n)}> ${esc(l.n)}${l.note?` <span class="muted" style="font-size:11px">(${esc(l.note)})</span>`:''}</label>`).join('')}</div>`).join('')}
 <h3>Other</h3><textarea rows="2" placeholder="Anything unusual: a specific alien weapon, a local dialect..." oninput="setField('profs.other',this.value)" onchange="commit(false)">${esc(P.other||'')}</textarea>
 <p class="rule" style="margin-top:8px">Wearing armour you're not proficient in gives disadvantage on attacks and on Strength and Dexterity checks and saves.</p>`},

defenses(){const custom=C.defenses,DTL={resist:'Resistance',immune:'Immunity',vuln:'Vulnerability'};
 return`<h2>Defences</h2><p>Resistance halves damage of that type. Immunity means you take none. Vulnerability doubles it. Multiple resistances to the same damage type don't stack.</p>
 <h3>From your race, origins and class</h3>${[...D.immune.map(x=>'Immunity: '+x),...D.defAuto.map(x=>'Resistance: '+x)].map(x=>`<div class="kv"><span>${esc(x)}</span></div>`).join('')||'<p class="muted">None</p>'}
 <h3>Other</h3>${custom.length?custom.map((x,i)=>`<div class="kv"><span>${DTL[x.type]}: ${esc(x.dmg)}${x.note?' ('+esc(x.note)+')':''}</span><button class="btn sm" ${on('removeDefense',i)}>Remove</button></div>`).join(''):'<p class="muted">None yet.</p>'}
 <h3>Add one</h3><div class="fgrid"><div><div class="lbl">Type</div><select id="def-type"><option value="resist">Resistance</option><option value="immune">Immunity</option><option value="vuln">Vulnerability</option></select></div>
 <div><div class="lbl">Damage type</div><select id="def-dmg"><option value="">Choose</option>${DAMAGE_TYPES.map(d=>`<option>${d}</option>`).join('')}</select></div></div>
 <input id="def-note" placeholder="Source, e.g. Inspired, temporary" style="margin-bottom:8px"><button class="btn" onclick="addDefense()">Add</button>`},

conditions(){const eo=!!UI.exhOpen;return`<h2>Conditions</h2><p class="rule">Toggle anything affecting you. Rolls apply their advantage or disadvantage automatically where they can. Use the arrow for a condition's full rules text.</p>
 <h3>Exhaustion</h3><div class="exhrow"><span class="cname">Level</span><div class="exhlv">${['--',1,2,3,4,5,6].map((l,i)=>`<button class="${i===C.exh?'on':''}" ${on('setExh',i)}>${l}</button>`).join('')}</div>
  <button class="chev" ${on('toggleExhInfo')}>${eo?'︿':'⌄'}</button></div>
 ${eo?`<div class="condinfo" style="padding-left:0">${EXH.slice(1).map((t,i)=>`<div class="kv" style="${i+1<=C.exh?'color:var(--red2)':''}"><span>Level ${i+1}</span><span style="text-align:right">${t}</span></div>`).join('')}<p class="rule" style="margin-top:6px">Effects are cumulative. At level 3 and beyond, make a CON save (DC 10 + level) or fall unconscious. A long rest removes 1 level.</p></div>`:''}
 <h3>Conditions</h3>${Object.entries(CONDITIONS).map(([n,t])=>{const on_=C.conds.includes(n),open=!!(UI.condOpen&&UI.condOpen[n]);return`<div class="condrow"><div class="condmain" ${on('toggleCond',n)}><span class="tgl ${on_?'on':''}"></span><span class="cname">${n}</span></div><button class="chev" ${on('toggleCondInfo',n)}>${open?'︿':'⌄'}</button></div>${open?`<div class="condinfo">${esc(t)}</div>`:''}`}).join('')}`},

hp(){const st=D.hpState;let h=`<h2>Hit points</h2>`;
 if(st==='dead')h+=`<p style="color:var(--red2)">This character is dead. If the story brings them back (a sarcophagus, the Ritual of Life, the Nox...), revive them below.</p><div class="panel-actions">${btn('Revive at 1 HP','revive',[],'btn pri')}</div>`;
 if(st==='down'){h+=`<h3>Death saves</h3><div class="fgrid"><div><div class="lbl">Failures</div><div class="ds-row" style="justify-content:flex-start">${[0,1,2].map(i=>`<button class="pip f ${i<C.hp.ds.f?'on':''}" ${on('setDS','f',i<C.hp.ds.f?i:i+1)}></button>`).join('')}</div></div>
  <div><div class="lbl">Successes</div><div class="ds-row" style="justify-content:flex-start">${[0,1,2].map(i=>`<button class="pip s ${i<C.hp.ds.s?'on':''}" ${on('setDS','s',i<C.hp.ds.s?i:i+1)}></button>`).join('')}</div></div></div>
  <div class="panel-actions">${rollBtn('Roll death save','rollDeathSave')}${btn('Mark stable','setStable')}</div>
  <p class="rule">Stabilise DC for a teammate using Medicine at this tension: <b>${TENSION[C.tension].dc}</b>.</p>`}
 h+=`<h3>Current</h3><div class="fgrid"><div><div class="lbl">Current HP</div><input type="number" value="${D.hp}" onchange="setHP(this.value)"></div><div><div class="lbl">Temp HP</div><input type="number" min="0" value="${C.hp.temp||0}" onchange="setNum('hp.temp',this.value)"></div></div>
 <div class="fgrid"><div><div class="lbl">Amount</div><input id="hpamt2" type="number" inputmode="numeric" placeholder="0"></div><div style="display:flex;gap:6px;align-items:flex-end"><button class="btn" style="flex:1;color:var(--grn2);border-color:var(--grn)" onclick="hpApply(1,'hpamt2')">Heal</button><button class="btn danger" style="flex:1" onclick="hpApply(-1,'hpamt2')">Damage</button></div></div>
 <label class="frow"><input type="checkbox" id="critdmg"> Damage is from a critical hit (2 death save failures at 0 HP)</label>
 <h3>Maximum HP: ${D.maxHP}</h3><div class="kv"><span>Calculated (${D.cls?D.cls.n+' d'+D.hdie:'no class'}, level ${D.lvl}, CON ${sgn(D.m.con)}${D.race?', '+D.race.n+' +'+D.race.hp:''}${D.origins.some(o=>o.hpl)?', Drills':''})</span><b>${D.autoMax}</b></div>
 <div class="fgrid"><div><div class="lbl">Max HP modifier</div><input type="number" value="${+C.hp.mod||0}" onchange="setNum('hp.mod',this.value)"></div><div><div class="lbl">Override max HP</div><input type="number" placeholder="--" value="${C.hp.override??''}" onchange="setOverride(this.value)"></div></div>
 ${C.exh>=4?'<p style="color:var(--red2)">Exhaustion 4+: maximum HP is halved.</p>':''}
 <h3>Rules</h3><ul class="rule"><li><b>Healthy</b> is full HP, <b>scuffed</b> is half or more, <b>wounded</b> is below half.</li><li>Temporary HP soak damage first, don't stack (keep the higher), and last until your next long rest.</li>
 <li>At 0 HP you fall unconscious. If the damage left over after reaching 0 equals or exceeds your max HP, you die instantly.</li>
 <li>At the start of each turn at 0 HP, roll a death save: 10+ succeeds. A natural 1 counts as two failures, a natural 20 heals 1 HP. Three successes: stable. Three failures: dead.</li>
 <li>Taking damage at 0 HP is a failure (two on a critical hit). A stable character regains 1 HP after 1d4 hours.</li></ul>
 <p class="rule">Max HP: full hit die + CON at level 1, then the class's per-level HP + CON each level, plus your race's one-off bonus.</p>`;return h},

shortrest(){const J=C.race==='jaffa',hum=C.race==='human_tauri'||C.race==='human_abydonian',heal=D.origins.some(o=>o.n==='Healer');const bonus=Math.max(D.m.con,D.prof);
 const resets=D.res.filter(r=>r.reset==='short');return`<h2>Short rest</h2><p>At least one hour of downtime in a relatively secure place: eating, drinking, reading and tending wounds.</p>
 <h3>Recover</h3>${J?`<p>Kelno'reem: Jaffa with a symbiote don't heal naturally during a short rest.</p>`:`<div class="kv"><span>1d${D.hdie} + ${bonus} (higher of CON or proficiency)${hum?' + TD (Recovery)':''}${heal?' + '+D.prof+' (Soothe)':''}</span><b>HP</b></div>
  <label class="frow" style="margin-top:6px"><input type="checkbox" id="sr-auto" checked> Roll and apply healing automatically</label>`}
 <p class="rule">A Med Kit can heal each character once per short rest on top of this (1d8 wounded or 1d4 scuffed, doubled dice if proficient).</p>
 <h3>Resets</h3>${resets.length?resets.map(r=>`<div class="kv"><span>${esc(r.name)}</span><b>${r.used?'Recovers '+r.used:'Full'}</b></div>`).join(''):'<p class="muted">Nothing on your sheet resets on a short rest.</p>'}
 <div class="panel-actions">${btn('Take short rest','takeShortRest',[],'btn pri')}</div>`},
longrest(){const bonus=Math.max(D.m.con,D.prof);let heal=`${D.lvl}d${D.hdie} + ${bonus} (hit dice equal to level, plus higher of CON or proficiency)`;
 if(C.race==='jaffa')heal=`${D.lvl} x ${D.hdie} + ${bonus} (Kelno'reem: hit dice roll maximum)`;if(C.race==='tokra'||C.race==='tokra_pangaran')heal='Full HP (Regeneration)';
 const resets=D.res.filter(r=>r.reset==='short'||r.reset==='long');return`<h2>Long rest</h2><p>At least 8 hours of sleep or light activity, with no more than 2 hours on watch. An hour of walking or any fighting interrupts it. Only one long rest per 24 hours.</p>
 ${D.hp<1?'<p style="color:var(--red2)">You need at least 1 HP at the start of a long rest to benefit from it.</p>':''}
 <h3>Recover</h3><div class="kv"><span>${heal}</span><b>HP</b></div>
 <div class="kv"><span>Exhaustion</span><b>${C.exh?C.exh+' → '+(C.exh-1):'None'}</b></div><div class="kv"><span>Determination</span><b>${D.dp} → ${D.dpBase}</b></div>
 <div class="kv"><span>Temporary HP (expire)</span><b>${C.hp.temp||0} → 0</b></div><div class="kv"><span>Ability score damage</span><b>Heals 1 point</b></div>
 <h3>Resets</h3>${resets.length?resets.map(r=>`<div class="kv"><span>${esc(r.name)}</span><b>${r.used?'Recovers '+r.used:'Full'}</b></div>`).join(''):'<p class="muted">No trackers to reset.</p>'}
 <div class="panel-actions">${D.hp<1?'':btn('Take long rest','takeLongRest',[],'btn pri')}</div>`},

newmission(){const mres=D.res.filter(r=>r.reset==='mission');return`<h2>Mission completed</h2><p>Resets anything that works once per mission${C.cls==='scientist'?', and sets your Eureka points to '+(D.lvl>=5?Math.floor(D.prof/2)+' (Casual Genius)':'0 (unspent Eureka is lost between missions)'):''}.</p>
 ${mres.map(r=>`<div class="kv"><span>${esc(r.name)}</span><b>Resets</b></div>`).join('')}<p class="rule">It doesn't heal you. Take a long rest separately if the GM says you've had one.</p>
 <div class="panel-actions">${btn('Mission completed','newMission',[],'btn pri')}</div>`},

manage(){const oo=(slot)=>{const cur=C.origins[slot];const other=C.origins[1-slot];const oc=ORIGINS[other]?.c;
  return`<select onchange="setOrigin(${slot},this.value)"><option value="">None</option>${['Biome','Background','Racial'].map(cat=>`<optgroup label="${cat}${oc===cat?' (used by your other origin)':''}">${Object.entries(ORIGINS).filter(([n,o])=>o.c===cat).map(([n,o])=>{const bad=(oc===cat)||(o.req&&!o.req.includes(C.race));return`<option value="${esc(n)}" ${cur===n?'selected':''} ${bad&&cur!==n?'disabled':''}>${esc(n)}</option>`}).join('')}</optgroup>`).join('')}</select>`};
 return`<h2>Manage character</h2><div class="lbl">Name</div><input value="${esc(C.name)}" oninput="setField('name',this.value);renderHeader()" style="margin-bottom:10px">
 <div class="lbl">Portrait</div><div class="frow"><div class="portrait" style="background-image:${C.portrait?'url('+C.portrait+')':'none'}"></div><button class="btn" onclick="$('portraitUp').click()">Upload</button>${C.portrait?btn('Remove','setVal',['portrait',''],'btn sm'):''}<input type="file" id="portraitUp" class="hidden" accept="image/*" onchange="loadPortrait(event)"></div>
 <div class="fgrid"><div><div class="lbl">Race</div><select onchange="setRace(this.value)"><option value="">Choose race</option>${Object.entries(RACES).map(([k,r])=>`<option value="${k}" ${C.race===k?'selected':''}>${esc(r.n)}</option>`).join('')}</select></div>
 <div><div class="lbl">Class</div><select onchange="setClass(this.value)"><option value="">Choose class</option>${Object.entries(CLASSES).map(([k,c])=>`<option value="${k}" ${C.cls===k?'selected':''}>${c.n}</option>`).join('')}</select></div></div>
 <div class="fgrid"><div><div class="lbl">Level</div><div class="lvlbox"><button class="rbtn" aria-label="Level down" ${on('lvlAdj',-1)}>\u2212</button><input type="number" min="1" max="20" value="${D.lvl}" onchange="setLevel(this.value)"><button class="rbtn" aria-label="Level up" ${on('lvlAdj',1)}>+</button></div></div><div><div class="lbl">Hit die</div><input disabled value="d${D.hdie}"></div></div>
 <h3>Origins (two, different categories)</h3><div class="fgrid"><div>${oo(0)}</div><div>${oo(1)}</div></div>
 ${D.origins.map(o=>`<p class="rule" style="margin-bottom:4px"><b>${esc(o.n)}</b>: ${esc(o.a)}. ${esc(o.ab)}.</p>`).join('')}
 <h3>Ability scores</h3><div class="fgrid" style="grid-template-columns:repeat(3,1fr)">${ABILS.map(a=>`<div><div class="lbl">${AB(a.k)}</div><input type="number" min="1" max="30" value="${C.scores[a.k]}" onchange="setScore('${a.k}',this.value)"></div>`).join('')}</div>
 <p class="rule">Enter final scores including your race's +2 and any origin +1. Point buy is 27 points, or roll 4d6 and drop the lowest die.</p>
 ${D.race?`<p class="rule">${esc(D.race.n)}: ${esc(D.race.asi)}. Proficiencies: ${esc(D.race.prof)}.</p>`:''}
 ${C.cls==='soldier'&&D.lvl>=3?`<h3>Improved Critical weapon type</h3><select onchange="setVal('impCrit',this.value)"><option value="">Choose</option>${['common','sidearms','longarms','shotguns','bows','martial','jaffa'].map(k=>`<option ${C.impCrit===k?'selected':''}>${k}</option>`).join('')}</select>`:''}
 <h3>Class defaults</h3><p class="rule">Choosing a class ticks its saves and skills and fills proficiencies. Re-apply if you've cleared them.</p><div class="panel-actions" style="margin-top:0">${D.cls?btn('Re-apply '+D.cls.n+' defaults','applyClassDefaults',[],'btn sm'):''}</div>`},

item(id){const it=C.inv.find(i=>i.id===id);if(!it)return'<p class="muted">Item not found.</p>';
 let h=`<h2>${esc(it.n)}</h2><p class="rule">${esc(it.src||'Custom')} • Tech level ${it.tl??'-'}${it.kit?' • Base kit':''}</p>${it.d?`<p>${esc(it.d)}</p>`:''}`;
 if(it.w){h+=`<h3>Attacks</h3>`+it.w.modes.map((md,mi)=>{const s=modeStats(it,mi);return`<div class="kv"><span>${esc(md[0])} • ${esc(s.rng||'1m')} • ${esc(s.dt)}</span><span style="display:flex;gap:5px"><button class="rbtn" ${on('rollAttack',id,mi)}>${sgn(s.hit)}</button>${s.dmgExpr!=='0'?`<button class="rbtn" ${on('rollWeaponDmg',id,mi,false)}>${esc(s.dmgExpr)}</button><button class="rbtn" title="Critical damage" ${on('rollWeaponDmg',id,mi,true)}>Crit</button>`:''}</span></div>`}).join('');
  if(it.w.sp)h+=`<p class="rule" style="margin-top:8px">${esc(it.w.sp)}</p>`}
 if(it.a)h+=`<h3>Armour</h3><div class="kv"><span>Type</span><b>${it.a.kind==='addon'?'Add-on':it.a.kind}</b></div><div class="kv"><span>AC</span><b>${it.a.kind==='addon'?'+'+it.a.ac:it.a.ac+(it.a.kind==='light'?' + DEX':'')}</b></div>${it.a.str?`<div class="kv"><span>Strength needed</span><b>${it.a.str}</b></div>`:''}<div class="kv"><span>Loadout</span><b>${it.a.kind==='addon'?(it.a.load?it.a.load:'0'):it.a.load+' + STR'}</b></div>${it.a.stealth?'<div class="kv"><span>Stealth</span><b>Disadvantage</b></div>':''}`;
 h+=`<div class="panel-actions">${(it.w||it.a)?btn(it.eq?'Unequip':'Equip','toggleEquip',[id]):''}</div>`;
 h+=custBlock('item-'+id,`${it.w?`<div class="fgrid"><div><div class="lbl">Proficient</div><select onchange="setItem('${id}','prof',this.value)">${[['auto','Automatic ('+(weaponProf(it.w.pc)?'yes':'no')+')'],['yes','Yes'],['no','No']].map(([v,l])=>`<option value="${v}" ${it.prof===v?'selected':''}>${l}</option>`).join('')}</select></div>
   <div><div class="lbl">Proficiency group</div><select onchange="setItemW('${id}','pc',this.value)">${['common','bows','sidearms','longarms','shotguns','martial','jaffa','gunnery','explosives'].map(k=>`<option ${it.w.pc===k?'selected':''}>${k}</option>`).join('')}</select></div></div>`:''}
  <div class="fgrid" style="margin-top:${it.w?8:0}px"><div><div class="lbl">Name</div><input value="${esc(it.n)}" onchange="setItem('${id}','n',this.value)"></div><div><div class="lbl">Quantity</div><input type="number" min="0" value="${it.qty||1}" onchange="setItem('${id}','qty',+this.value)"></div>
   <div><div class="lbl">Bulk each</div><input type="number" min="0" value="${it.b||0}" onchange="setItem('${id}','b',+this.value)"></div><div><div class="lbl">Tech level</div><input type="number" min="0" max="5" value="${it.tl??''}" onchange="setItem('${id}','tl',+this.value)"></div></div>
   ${it.w?`<div class="fgrid">${it.w.modes.map((md,mi)=>`<div><div class="lbl">${esc(md[0])} damage</div><input value="${esc(md[2])}" onchange="setMode('${id}',${mi},2,this.value)"></div>`).join('')}</div><p class="rule">Damage dice like 2d6, 1d8+TD. Your ability modifier is added automatically.</p>`:''}
   <div class="lbl">Notes</div><textarea rows="3" onchange="setItem('${id}','notes',this.value)">${esc(it.notes||'')}</textarea>
   <label class="frow" style="margin-top:8px"><input type="checkbox" ${it.kit?'checked':''} onchange="setItem('${id}','kit',this.checked)"> Part of issued base kit (no bulk)</label>
   <div class="panel-actions">${btn('Remove','removeItem',[id],'btn danger')}</div>`);
 return h},

additem(){const q=UI.addq.toLowerCase(),t=UI.addt;const list=allCatalog().filter(c=>(t==='all'||c.t===t)&&(!q||c.n.toLowerCase().includes(q)||(c.d||'').toLowerCase().includes(q)));
 return`<h2>Add items</h2><button class="btn ${UI.custOpen?'on':''}" ${on('toggleCust')}>Add a custom item</button><div class="${UI.custOpen?'':'hidden'}" style="margin-top:10px"><p class="rule">Something you found or were given that you would like to add to your inventory</p>
 <div class="fgrid"><div><div class="lbl">Name</div><input id="ci-n"></div><div><div class="lbl">Type</div><select id="ci-t" onchange="ciType()"><option value="gear">Gear</option><option value="weapon">Weapon</option><option value="armor">Armour</option><option value="trinket">Trinket</option><option value="other">Other</option></select></div>
 <div><div class="lbl">Bulk</div><input id="ci-b" type="number" value="1"></div>
 <div id="ci-w" class="hidden"><div class="lbl">Damage</div><input id="ci-d" placeholder="1d8"></div>
 <div id="ci-a" class="hidden"><div class="lbl">AC</div><input id="ci-ac" type="number" value="11"></div>
 <div id="ci-k" class="hidden"><div class="lbl">Armour type</div><select id="ci-ak"><option value="light">Light</option><option value="heavy">Heavy</option><option value="addon">Add-on (adds to AC)</option></select></div></div>
 <div class="lbl">Description</div><textarea id="ci-desc" rows="2"></textarea><div class="panel-actions"><button class="btn pri" onclick="addCustomItem()">Add custom item</button></div>
 </div><h3>Items list</h3>
 <input id="addq" placeholder="Search: sidearm, med kit, staff..." value="${esc(UI.addq)}" oninput="UI.addq=this.value;renderAddList()">
 <div class="filters" style="margin-top:8px">${[['all','All'],['weapon','Weapons'],['armor','Armour'],['gear','Gear']].map(([k,l])=>`<button class="${t===k?'on':''}" ${on('setAddType',k)}>${l}</button>`).join('')}</div>
 <div id="addlist">${addListHtml(list)}</div>`},
additemOld(){const q=UI.addq.toLowerCase(),t=UI.addt;
const list=allCatalog().filter(c=>(t==='all'||c.t===t)&&(!q||c.n.toLowerCase().includes(q)||(c.d||'').toLowerCase().includes(q)));
 return`<h2>Add items</h2><p class="rule">Everything from the rulebook, plus anything ${isGM?'you\'ve':'your GM has'} added to the campaign list below. An amber note means it's flagged, not proficient, too heavy, or alien tech needing GM sign-off, but you can still add it. Items already in your inventory show a quantity stepper here instead of Add.</p>
 <input id="addq" placeholder="Search: sidearm, med kit, staff..." value="${esc(UI.addq)}" oninput="UI.addq=this.value;renderAddList()">
 <div class="filters" style="margin-top:8px">${[['all','All'],['weapon','Weapons'],['armor','Armour'],['gear','Gear']].map(([k,l])=>`<button class="${t===k?'on':''}" ${on('setAddType',k)}>${l}</button>`).join('')}</div>
 <div id="addlist">${addListHtml(list)}</div>
 <h3>Custom item (just for you)</h3><div class="fgrid"><div><div class="lbl">Name</div><input id="ci-n"></div><div><div class="lbl">Type</div><select id="ci-t"><option value="gear">Gear</option><option value="weapon">Weapon</option></select></div>
 <div><div class="lbl">Bulk</div><input id="ci-b" type="number" value="1"></div><div><div class="lbl">Damage (weapons)</div><input id="ci-d" placeholder="1d8"></div></div>
 <div class="lbl">Description</div><textarea id="ci-desc" rows="2"></textarea><div class="panel-actions"><button class="btn pri" onclick="addCustomItem()">Add custom item</button></div>
 ${isGM?`<h3>Campaign items (everyone can see these)</h3><p class="rule">Add loot here once a player finds or is given it, and they can pick it up themselves from this same list, on their own device.</p>
 ${CAMPAIGN_ITEMS.length?CAMPAIGN_ITEMS.map(r=>`<div class="res"><div class="rn"><b>${esc(r.name)}</b><small>${esc((r.data&&r.data.d)||'')}</small></div><button class="btn sm danger" ${on('removeCampaignItem',r.id)}>Remove</button></div>`).join(''):'<p class="muted">Nothing added yet.</p>'}
 <div class="fgrid" style="margin-top:8px"><div><div class="lbl">Name</div><input id="gi-n" placeholder="e.g. Vorah signet ring"></div><div><div class="lbl">Type</div><select id="gi-t"><option value="gear">Gear</option><option value="weapon">Weapon</option></select></div>
 <div><div class="lbl">Bulk</div><input id="gi-b" type="number" value="1"></div><div><div class="lbl">Tech level</div><input id="gi-tl" type="number" value="4"></div></div>
 <input id="gi-d" placeholder="Damage, if a weapon (e.g. 1d8)" style="margin-bottom:8px">
 <div class="lbl">Description</div><textarea id="gi-desc" rows="3" placeholder="What it is, what it does, anything the player has learned about it so far."></textarea>
 <div class="panel-actions"><button class="btn pri" onclick="addCampaignItem()">Add to campaign list</button></div>`:''}`},

action(n){if(n==='Unarmed')return`<h2>Unarmed strike</h2><p>A punch, kick or head-butt: 1 + STR bludgeoning damage. Characters proficient in Martial Arts deal 1d6 + STR instead. Improvised weapons deal 1d4. You're always proficient with unarmed strikes and improvised weapons.</p>`;
 const a=ACTIONS.find(x=>x.n===n);return`<h2>${esc(n)}</h2><p class="rule">${a.g==='contest'?'Combat contest':a.g==='reaction'?'Reaction':'Action'}</p><p>${esc(a.d)}</p>`},
feature(i){const f=D.cls?.f[i];if(!f)return'';return`<h2>${esc(f[1])}</h2><p class="rule">${D.cls.n} level ${f[0]} • ${{action:'Action',bonus:'Bonus action',reaction:'Reaction',other:'Feature'}[f[2]]}</p><p>${esc(f[3])}</p>`},
trait(i){const t=D.race?.tr[i];if(!t)return'';return`<h2>${esc(t[0])}</h2><p class="rule">${esc(D.race.n)} trait</p><p>${esc(t[1])}</p>`},
origin(n){const o=ORIGINS[n];return`<h2>${esc(n)}</h2><p class="rule">${o.c} origin • ${esc(o.a)}</p><h3>${esc(o.ab)}</h3><p>${esc(o.t)}</p>`},
res(key){const r=D.res.find(x=>x.key===key);if(!r)return'';const cust=key.startsWith('c_');return`<h2>${esc(r.name)}</h2><p class="rule">${r.src} • ${RESET_L[r.reset]} • ${r.max-r.used} of ${r.max} left</p>${r.desc?`<p>${esc(r.desc)}</p>`:''}
 <div class="panel-actions">${btn('Use one','useRes',[key,1],'btn pri')}${btn('Restore one','useRes',[key,-1])}${cust?btn('Delete tracker','removeRes',[key.slice(2)],'btn danger'):''}</div>`},
addres(){return`<h2>Add a tracker</h2><p class="rule">For anything with limited uses the sheet doesn't track yet: a feat, a gadget, grenades, charges.</p>
 <div class="lbl">Name</div><input id="nr-n" style="margin-bottom:8px"><div class="fgrid"><div><div class="lbl">Uses</div><input id="nr-m" type="number" min="1" value="1"></div><div><div class="lbl">Resets on</div><select id="nr-r"><option value="short">Short rest</option><option value="long">Long rest</option><option value="mission">New mission</option><option value="none">Manual only</option></select></div></div>
 <div class="lbl">Description</div><textarea id="nr-d" rows="3"></textarea><div class="panel-actions"><button class="btn pri" onclick="addRes()">Add tracker</button></div>`},
feat(id){const f=C.feats.find(x=>x.id===id);if(!f)return'';const book=FEATS.find(x=>x.n===f.name);const ty=TYL[mt('F',f.name,{action:'action',bonus:'bonus',reaction:'reaction'}[featType(f)]||'pass')];
 let h=`<h2>${esc(f.name)}</h2><p class="rule">${esc(f.cat)}${+f.mp?' • '+f.mp+' MP':''} • ${ty}${book?' • '+esc(reqOf(book)):''}</p><p>${esc(f.desc||'')}</p>`;
 h+=custBlock('feat-'+id,`<div class="lbl">Name</div><input value="${esc(f.name)}" onchange="setFeat('${id}','name',this.value)" style="margin-bottom:8px">
 <div class="fgrid"><div><div class="lbl">Category</div><select onchange="setFeat('${id}','cat',this.value)">${FEAT_CATS.map(c=>`<option ${f.cat===c?'selected':''}>${c}</option>`).join('')}</select></div><div><div class="lbl">MP cost</div><input type="number" min="0" value="${+f.mp||0}" onchange="setFeat('${id}','mp',+this.value)"></div></div>
 <div class="lbl">Description</div><textarea rows="6" onchange="setFeat('${id}','desc',this.value)">${esc(f.desc||'')}</textarea>

// ---------- upload (compressed in the browser first, so 500 MB goes a long way) ----------
function loadBitmap(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('that file isn\'t an image this browser can read'))};img.src=url})}
function toJpeg(img,max,q){const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.max(1,Math.round(img.naturalWidth*r)),h=Math.max(1,Math.round(img.naturalHeight*r));
 const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(img,0,0,w,h);
 return new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('couldn\'t compress it')),'image/jpeg',q))}
async function makeImageBlobs(file){if(file.size>25*1024*1024)throw new Error('over 25 MB');const img=await loadBitmap(file);return{full:await toJpeg(img,1600,.82),thumb:await toJpeg(img,360,.75)}}
async function uploadImages(ev){
 const files=[...ev.target.files];ev.target.value='';if(!files.length||!sb||!meId||IMG.uploading)return;
 IMG.uploading=true;let ok=0;
 for(const f of files){
  try{
   toast('Uploading '+(ok+1)+' of '+files.length+'...');
   const{full,thumb}=await makeImageBlobs(f);
   const base=meId+'/'+((window.crypto&&crypto.randomUUID)?crypto.randomUUID():uid()+uid());
   const p1=base+'.jpg',p2=base+'_t.jpg',store=sb.storage.from(IMG_BUCKET);
   let r=await store.upload(p1,full,{contentType:'image/jpeg',upsert:false});if(r.error)throw r.error;
   r=await store.upload(p2,thumb,{contentType:'image/jpeg',upsert:false});if(r.error){await store.remove([p1]);throw r.error}
   const shared=(isGM&&UI.imgScope==='char'&&viewOwner&&viewOwner!==meId)?[viewOwner]:[];
   const ins=await sb.from('character_images').insert({owner_id:meId,path:p1,thumb_path:p2,caption:'',shared_with:shared}).select().single();
   if(ins.error){await store.remove([p1,p2]);throw ins.error}
   IMG.list.unshift(ins.data);ok++;
  }catch(e){toast('Couldn\'t upload '+f.name+': '+(e.message||e))}
 }
 IMG.uploading=false;if(ok){toast(ok+(ok>1?' images':' image')+' added');renderImages()}}

async function loadAddresses(force){

// What is on screen. Players get exactly what the database returned. The GM can preview one player.

  l=l.filter(a=>a.audience==='all'||(a.audience==='some'&&em&&(a.shared_with||[]).some(e=>String(e).trim().toLowerCase()===em)))}
 const q=ADR.q.trim().toLowerCase();
 if(q)l=l.filter(a=>((a.name||'')+' '+(a.tag||'')+' '+(a.player_info||'')+' '+(a.symbols||[]).map(i=>(pgById(i)||{}).sound||'').join(' ')).toLowerCase().includes(q));
 return l}

function audBadge(a){
 if(a.audience==='all')return'<span class="chip">Everyone</span>';
 if(a.audience==='gm')return'<span class="chip bad">GM only</span>';
 const who=(a.shared_with||[]).join(', ');return`<span class="chip" title="${esc(who)}">Only: ${esc(who||'nobody yet')}</span>`}

function addrCard(a){
 const syms=a.symbols||[],ori=a.origin?pgById(a.origin):null,note=ADR.notes[a.id],open=!!ADR.open[a.id];
 const sounds=syms.map(i=>(pgById(i)||{}).sound||'?').join("'"),poetic=syms.map(i=>((pgById(i)||{}).meaning||'').split(',')[0]).join(' · ');
 const canNote=viewOwner===meId,gm=isGM?ADR.gm[a.id]:null;
 const playerView=!isGM||UI.adrScope==='char'; // true whenever this is (or exactly simulates) a player's own view
 const nickname=note&&note.nickname?note.nickname:'';
 const nameBlock=playerView
  ?(canNote?`<input class="adr-nick" placeholder="Name this address" maxlength="80" value="${esc(nickname)}" onchange="saveAddrNickname('${a.id}',this.value)">`
            :`<span class="adr-name">${esc(nickname||'Not named yet')}</span>`)
  :`<span class="adr-name">${esc(a.name)}</span>`;
 const ADR_COLORS={red:'#d9524a',orange:'#e08a3c',green:'#4caf6e'};
const glyphBorder=ADR_COLORS[a.color]?` style="border:2px solid ${ADR_COLORS[a.color]}"`:'';
return`<article class="box adr">
<div class="adr-top">${nameBlock}${a.tag?`<span class="chip">${esc(a.tag)}</span>`:''}${!playerView?audBadge(a):''}</div>
<div class="adr-glyphs"${glyphBorder}>${syms.map(i=>`<span class="adr-g">${pgSvg(i)}</span>`).join('')}${ori?`<span class="adr-sep"></span><span class="adr-g adr-o" title="Point of origin">${pgSvg(ori.id)}</span>`:''}</div>
 ${playerView?'':`<div class="adr-snd">${esc(sounds)}${ori?` <span class="adr-from">from ${esc(ori.sound)}</span>`:''}</div>
 <div class="adr-poetic">${esc(poetic)}</div>`}
 ${a.player_info?`<p class="adr-info">${esc(a.player_info)}</p>`:''}
 ${gm&&(gm.notes||gm.visited)?`<div class="adr-gm"><b>GM notes</b>${gm.visited?' • visited '+esc(gm.visited):''}<br>${esc(gm.notes||'')}</div>`:''}
 <button class="adr-nt ${open?'open':''}" ${on('toggleAddrNotes',a.id)}>${CHEV_D}<span>${canNote?'My notes':'Player\'s notes'}${note&&note.note?' •':''}</span></button>
 ${open?`<div class="adr-notes">${canNote?`<textarea rows="4" maxlength="2000" placeholder="Only you and your GM can see this" onchange="saveAddrNote('${a.id}',this.value)">${esc(note?note.note:'')}</textarea>`:`<div class="adr-ro">${esc(note&&note.note?note.note:'Nothing written yet.')}</div>`}</div>`:''}
 </article>`}

function renderAddrList(){const el=$('adr-list');if(!el)return;const l=addrVisible();
 el.innerHTML=l.length?`<div class="adr-grid">${l.map(addrCard).join('')}</div>`:`<div class="empty">${ADR.q?'No matches.':'No addresses on this device yet.'}</div>`}

 const scope=isGM?`<div class="seg">${[['char','What this player sees'],['all','Everything']].map(([k,l])=>`<button class="${UI.adrScope===k?'on':''}" ${on('setAdrScope',k)}>${l}</button>`).join('')}</div>`:'';
 let body,note='';

 else note='Showing every address, including GM only ones.';}
 host.innerHTML=`${isGM?`<div class="viewbar"><div class="viewact">${scope}</div></div>`:''}${note?`<p class="rule" style="padding:0 14px">${note}</p>`:''}<div class="viewbody">${body}</div>`;

function setPath(o,path,v){const ks=path.split('.');let t=o;ks.slice(0,-1).forEach(k=>{if(t[k]==null)t[k]={};t=t[k]});t[ks[ks.length-1]]=v}

function setTheme(k){C.theme=k;applyTheme(k);commit(false);if(UI.panel.k==='appearance')renderSide()}
function applyTheme(k){if(!THEMES[k])k='ancient_crystal';const t=THEMES[k];const r=document.documentElement.style;
 r.setProperty('--glass',k.endsWith('_light')?'rgba(255,255,255,.72)':'rgba(9,13,24,.72)');
 for(const v in t)r.setProperty('--'+v,t[v]);r.setProperty('--bodyBg',t.bodyBg||t.bg);document.body.classList.toggle('lighttheme',k.endsWith('_light'));
 document.body.className=document.body.className.replace(/\bskin-\S+/g,'').trim();if(t.skin)document.body.classList.add('skin-'+t.skin);
 r.setProperty('--glass-hi',k.endsWith('_light')?'rgba(0,0,0,.04)':'rgba(255,255,255,.05)');
 applyAppearance()}
function applyAppearance(){document.body.className=document.body.className.replace(/\bbs-\S+/g,'').trim();
 document.body.classList.add('bs-'+(C.borderStyle||'hud'));
 document.body.className=document.body.className.replace(/(^|\s)(font|corners)-\S+/g,' ').trim();if(C.font&&C.font!=='default')document.body.classList.add('font-'+C.font);if(C.corners&&C.corners!=='default')document.body.classList.add('corners-'+C.corners);document.body.classList.toggle('nightmode',!!C.nightMode);
 document.body.style.backgroundImage=C.bgImage?`linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.7)),url(${C.bgImage})`:'';
 document.body.style.backgroundSize=C.bgImage?'cover':'';document.body.style.backgroundAttachment=C.bgImage?'fixed':''}
function themeLabel(k){return k.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).replace('Sgc','SGC').replace('Goauld',"Goa'uld").replace('Tokra',"Tok'ra").replace('Kethalis',"Keth'alis")}
function setBorderStyle(k){C.borderStyle=k;applyAppearance();commit(false)}

function setCorners(k){C.corners=k;applyAppearance();commit(false);renderSide()}

function clearBg(){C.bgImage='';applyAppearance();commit(false);renderSide()}
function loadBgImage(ev){const f=ev.target.files[0];if(!f)return;const img=new Image();const url=URL.createObjectURL(f);
 img.onload=()=>{const s=1280,cv=document.createElement('canvas');const r=Math.min(1,s/Math.max(img.width,img.height));cv.width=Math.round(img.width*r);cv.height=Math.round(img.height*r);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);C.bgImage=cv.toDataURL('image/jpeg',.75);URL.revokeObjectURL(url);applyAppearance();commit(false);renderSide()};img.src=url}

 const upg=upgradeProfs({armor:c.armor,weapons:c.weapons,tools:c.tools,languages:C.profs.languages.join(', ')});

 commit();if(!quiet)toast(c.n+' defaults applied')}

// HP & death
function hpApply(sign,inputId='hpamt'){const el=$(inputId);const n=Math.abs(parseInt(el&&el.value)||0);if(!n)return;
 if(sign>0)heal(n,'Healed');else damage(n,!!($('critdmg')&&$('critdmg').checked));if(el)el.value=''}
function heal(n,why){if(C.hp.dead)return toast('Dead characters can\'t be healed');const before=D.hp;C.hp.cur=Math.min(D.maxHP,D.hp+n);
 if(C.hp.cur>0){C.hp.ds={s:0,f:0};C.hp.stable=false}logInfo(why||'Healed','+'+(C.hp.cur-before)+' HP ('+before+' → '+C.hp.cur+')');commit()}
function damage(n,crit){if(C.hp.dead)return;let left=n;const t=+C.hp.temp||0;if(t){const u=Math.min(t,left);C.hp.temp=t-u;left-=u}
 const cur=D.hp;let msg='';
 if(cur>0){const nc=cur-left;if(nc>0){C.hp.cur=nc;msg=cur+' → '+nc}else{C.hp.cur=0;const over=-nc;
   if(over>=D.maxHP){C.hp.dead=true;msg='Massive damage: '+over+' left over after 0 HP equals or exceeds max HP. Killed outright.'}else{C.hp.ds={s:0,f:0};C.hp.stable=false;msg='Down to 0 HP and unconscious. Start death saves.'}}}
 else if(left>0){if(left>=D.maxHP){C.hp.dead=true;msg='Massive damage at 0 HP. Killed outright.'}else{C.hp.stable=false;C.hp.ds.f+=crit?2:1;msg='Damage at 0 HP: '+(crit?'two death save failures':'one death save failure');if(C.hp.ds.f>=3){C.hp.dead=true;msg+='. Three failures: dead.'}}}
 logInfo('Took '+n+' damage'+(t?' ('+Math.min(t,n)+' absorbed by temp HP)':''),msg||'Absorbed by temporary HP');commit()}
function setHP(v){C.hp.cur=clamp(parseInt(v)||0,0,D.maxHP);if(C.hp.cur>0){C.hp.ds={s:0,f:0};C.hp.stable=false}commit()}
function setOverride(v){C.hp.override=v===''?null:+v;commit()}
function rollDeathSave(){if(C.hp.stable)return toast('You are stable. No death saves needed.');const n=die(20);let msg;
 if(n===20){C.hp.cur=1;C.hp.ds={s:0,f:0};msg='Natural 20! You regain 1 HP and wake up.'}
 else if(n===1){C.hp.ds.f+=2;msg='Natural 1: two failures.'}else if(n>=10){C.hp.ds.s++;msg='Success.'}else{C.hp.ds.f++;msg='Failure.'}
 if(C.hp.ds.f>=3){C.hp.dead=true;msg+=' Three failures: dead.'}else if(C.hp.ds.s>=3){C.hp.stable=true;C.hp.ds={s:0,f:0};msg+=' Three successes: stable.'}
 logRoll('Death save','',n,'1d20 ('+n+') • '+msg,n===20?'crit':n===1?'fumble':'');commit()}
function setDS(k,v){C.hp.ds[k]=clamp(v,0,3);if(C.hp.ds.f>=3)C.hp.dead=true;if(C.hp.ds.s>=3){C.hp.stable=true;C.hp.ds={s:0,f:0}}commit()}
function setStable(){C.hp.stable=true;C.hp.ds={s:0,f:0};logInfo('Stabilised','Unconscious but no longer making death saves. Regain 1 HP after 1d4 hours.');commit()}
function revive(){C.hp.dead=false;C.hp.cur=1;C.hp.ds={s:0,f:0};C.hp.stable=false;logInfo('Revived','Back at 1 HP.');commit()}
